openapi: 3.1.0
info:
  title: Funtino Device Integration Owner API
  version: 0.1.0
  description: Internal-only API for branch device registry and normalized, signed device observations.
servers:
  - url: http://localhost:4020
    description: Local development only
paths:
  /internal/v1/organizations/{organizationId}/devices:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      operationId: listDevices
      summary: List registered devices in an organization, optionally filtered to a branch
      security:
        - internalGatewayToken: []
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DeviceStatus' }
        - name: cursor
          in: query
          schema: { type: string, format: uuid }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Device page with health derived from persisted observations and configured freshness thresholds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicePage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v1/organizations/{organizationId}/branches/{branchId}/devices:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/BranchId'
    post:
      operationId: registerDevice
      summary: Register a device for an active branch
      description: The service validates the organization/branch pair with its owner. Registration is idempotent, audited, and written with its outbox event in one transaction.
      security:
        - internalGatewayToken: []
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegistration' }
      responses:
        '201':
          description: Registered device identity and current version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceCommandResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v1/organizations/{organizationId}/branches/{branchId}/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/DeviceId'
    get:
      operationId: getDevice
      summary: Get one device and its current derived health
      security:
        - internalGatewayToken: []
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    patch:
      operationId: updateDevice
      summary: Rename, suspend, reactivate, or retire a device with optimistic concurrency
      description: Retired devices are terminal. Reactivation requires the branch owner to confirm the branch is active.
      security:
        - internalGatewayToken: []
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceUpdate' }
      responses:
        '200':
          description: Updated device identity and current version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceCommandResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v1/device/health-observations:
    post:
      operationId: reportDeviceHealth
      summary: Ingest an authenticated normalized health observation
      description: HMAC-SHA256 covers the exact raw request body. Duplicate observation IDs are idempotent; older observations are retained but cannot replace newer current health.
      security:
        - deviceWebhookSignature: []
      parameters:
        - $ref: '#/components/parameters/OptionalCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HealthObservationInput' }
      responses:
        '202':
          description: Observation durably accepted or recognized as a duplicate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthObservationResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v1/device/events:
    post:
      operationId: importDeviceTransactionEvent
      summary: Import the existing signed device transaction event
      description: Existing normalized transaction contract is preserved; accepted event and durable outbox record are committed atomically.
      security:
        - deviceWebhookSignature: []
      parameters:
        - $ref: '#/components/parameters/OptionalCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceTransactionInput' }
      responses:
        '202':
          description: Event durably accepted or recognized as a duplicate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionImportResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v1/edge/installations:
    post:
      operationId: registerEdgeInstallation
      summary: Register a Windows Edge installation credential identity
      security:
        - internalGatewayToken: []
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceInstanceId, organizationId, branchId, currentKeyId]
              properties:
                sourceInstanceId: { type: string, format: uuid }
                organizationId: { type: string, format: uuid }
                branchId: { type: string, format: uuid }
                currentKeyId: { type: string, minLength: 1, maxLength: 120 }
              additionalProperties: false
      responses:
        '201': { description: Edge installation registered and audited. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v1/edge/installations/{sourceInstanceId}/rotate-key:
    post:
      operationId: rotateEdgeInstallationKey
      security:
        - internalGatewayToken: []
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: sourceInstanceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentKeyId]
              properties:
                currentKeyId: { type: string, minLength: 1, maxLength: 120 }
              additionalProperties: false
      responses:
        '200': { description: Edge credential rotated with one previous key retained for overlap. }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v1/operations/edge-pairings/approve:
    post:
      operationId: approveEdgeOperatorPairing
      summary: Approve an Edge pairing from the authenticated Operations Gateway
      description: The Gateway has checked the active management session, branch and every selected permission with IAM. Device Integration stores only a hash of the one-time code and rate limits attempts per actor.
      security:
        - internalGatewayToken: []
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, organizationId, branchId, managementSessionId, permissionKeys]
              properties:
                code: { type: string, minLength: 10, maxLength: 16 }
                organizationId: { type: string, format: uuid }
                branchId: { type: string, format: uuid }
                managementSessionId: { type: string, format: uuid }
                permissionKeys:
                  type: array
                  minItems: 1
                  maxItems: 10
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/EdgeOperatorPermission' }
              additionalProperties: false
      responses:
        '200':
          description: Code approved for this branch and permission set until expiry.
          content:
            application/json:
              schema:
                type: object
                required: [status, branchId, permissionKeys, expiresAt]
                properties:
                  status: { const: approved }
                  branchId: { type: string, format: uuid }
                  permissionKeys:
                    { type: array, items: { $ref: '#/components/schemas/EdgeOperatorPermission' } }
                  expiresAt: { type: string, format: date-time }
                additionalProperties: false
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          {
            description: Code is unknown,
            expired,
            already used,
            or does not belong to the selected branch.,
          }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { description: Actor has exceeded the pairing approval attempt limit. }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v2/edge/operator-pairings:
    post:
      operationId: startEdgeOperatorPairing
      summary: Start a short-lived operator pairing for this active installation
      description: Requires exact raw-body HMAC and an active installation/key. The code and poll secret are returned once; only their SHA-256 hashes are stored. Pairing expires after five minutes.
      security:
        - edgeHmacSignature: []
      parameters:
        - $ref: '#/components/parameters/EdgeInstallationId'
        - $ref: '#/components/parameters/EdgeKeyId'
        - $ref: '#/components/parameters/EdgeSignature'
        - $ref: '#/components/parameters/OptionalCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '201':
          description: One-time pairing code and private polling secret. Do not log or persist either value.
          content:
            application/json:
              schema:
                type: object
                required: [pairingId, userCode, pollSecret, expiresAt, pollIntervalSeconds]
                properties:
                  pairingId: { type: string, format: uuid }
                  userCode: { type: string, pattern: '^[A-HJ-NP-Z2-9]{5}-[A-HJ-NP-Z2-9]{5}$' }
                  pollSecret: { type: string, minLength: 40, maxLength: 64 }
                  expiresAt: { type: string, format: date-time }
                  pollIntervalSeconds: { type: integer, const: 3 }
                additionalProperties: false
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Installation request quota exceeded; retry later. }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v2/edge/operator-pairings/poll:
    post:
      operationId: pollEdgeOperatorPairing
      summary: Poll the one-time pairing and redeem an approved operator token
      description: HMAC, active installation, installation quota, pairing ID and private poll secret are required. An approved session is atomically claimed once. If the response is lost, start a new pairing; tokens are never persisted.
      security:
        - edgeHmacSignature: []
      parameters:
        - $ref: '#/components/parameters/EdgeInstallationId'
        - $ref: '#/components/parameters/EdgeKeyId'
        - $ref: '#/components/parameters/EdgeSignature'
        - $ref: '#/components/parameters/OptionalCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairingId, pollSecret]
              properties:
                pairingId: { type: string, format: uuid }
                pollSecret: { type: string, minLength: 32, maxLength: 128 }
              additionalProperties: false
      responses:
        '200':
          description: Current pairing state or one-time token response. Cache-Control is no-store.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [status]
                    properties:
                      {
                        status:
                          {
                            type: string,
                            enum: [pending, approved, expired, cancelled, restart_required],
                          },
                      }
                    additionalProperties: false
                  - type: object
                    required: [status, operatorToken]
                    properties:
                      status: { const: authorized }
                      operatorToken:
                        type: object
                        required:
                          [
                            token,
                            tokenId,
                            organizationId,
                            branchId,
                            permissionKeys,
                            expiresAt,
                            policyVersion,
                            catalogVersion,
                          ]
                        properties:
                          token: { type: string, minLength: 32, maxLength: 256 }
                          tokenId: { type: string, format: uuid }
                          organizationId: { type: string, format: uuid }
                          branchId: { type: string, format: uuid }
                          permissionKeys:
                            {
                              type: array,
                              items: { $ref: '#/components/schemas/EdgeOperatorPermission' },
                            }
                          expiresAt: { type: string, format: date-time }
                          policyVersion: { type: integer, minimum: 1 }
                          catalogVersion: { type: integer, minimum: 1 }
                        additionalProperties: false
                    additionalProperties: false
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { description: Installation request quota exceeded; retry later. }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v2/edge/operator-pairings/cancel:
    post:
      operationId: cancelEdgeOperatorPairing
      summary: Cancel a pending or approved pairing from its originating installation
      security:
        - edgeHmacSignature: []
      parameters:
        - $ref: '#/components/parameters/EdgeInstallationId'
        - $ref: '#/components/parameters/EdgeKeyId'
        - $ref: '#/components/parameters/EdgeSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairingId, pollSecret]
              properties:
                pairingId: { type: string, format: uuid }
                pollSecret: { type: string, minLength: 32, maxLength: 128 }
              additionalProperties: false
      responses:
        '200': { description: Pairing cancelled or already terminal. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { description: Installation request quota exceeded; retry later. }
  /internal/v2/edge/events:
    post:
      operationId: ingestEdgeTransactionBatch
      summary: Idempotently receive authenticated offline Windows events with per-event results
      description: HMAC-SHA256 covers the exact raw JSON body; installation identity, organization and branch are checked before events are durably accepted. Only successful operations are published to Wallet.
      security:
        - edgeHmacSignature: []
      parameters:
        - name: x-edge-installation-id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: x-edge-key-id
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: x-edge-signature
          in: header
          required: true
          schema: { type: string, pattern: '^sha256=[a-f0-9]{64}$' }
        - $ref: '#/components/parameters/OptionalCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../events/device/windows-edge-contract.v1.schema.json#/$defs/EdgeEventBatchRequest'
      responses:
        '200':
          description: Each event is accepted, recognized as duplicate, or rejected with a safe error code and retryability.
          content:
            application/json:
              schema:
                $ref: '../events/device/windows-edge-contract.v1.schema.json#/$defs/EdgeIngestResponse'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Installation rate limit exceeded; retry after reconnect. }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v2/edge/customers/temporary:
    post:
      operationId: registerTemporaryEdgeCustomer
      summary: Create an idempotent pending customer reconciliation record
      description: Requires the registered installation HMAC and a short-lived IAM operator token with customer.provisional.create for the installation branch. The installation scope supplies branchId; no name or phone matching is performed.
      security:
        - edgeHmacSignature: []
          edgeOperatorBearer: []
      parameters:
        - name: x-edge-installation-id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: x-edge-key-id
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: x-edge-signature
          in: header
          required: true
          schema: { type: string, pattern: '^sha256=[a-f0-9]{64}$' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/OptionalCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provisionalId]
              properties:
                provisionalId: { type: string, format: uuid }
              additionalProperties: false
      responses:
        '201':
          description: Central record is pending review and is not a confirmed customer.
          content:
            application/json:
              schema:
                type: object
                required:
                  [provisionalId, sourceInstanceId, branchId, status, createdAt, customerConfirmed]
                properties:
                  provisionalId: { type: string, format: uuid }
                  sourceInstanceId: { type: string, format: uuid }
                  branchId: { type: string, format: uuid }
                  status: { type: string, enum: [pending_review, linked, rejected] }
                  createdAt: { type: string, format: date-time }
                  customerConfirmed: { type: boolean, const: false }
                additionalProperties: false
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { description: Installation request quota exceeded; retry later. }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v2/edge/customers:
    get:
      operationId: searchEdgeCustomers
      summary: Search customers with the limited fields needed for a verified card assignment
      description: The installation resolves branch scope. Requires the customer.lookup.limited IAM permission. Search results contain stable IDs, display name, masked phone and record version only; linking always uses customerId/householdId/memberId, never name or phone similarity.
      security:
        - edgeHmacSignature: []
          edgeOperatorBearer: []
      parameters:
        - $ref: '#/components/parameters/EdgeInstallationId'
        - $ref: '#/components/parameters/EdgeKeyId'
        - $ref: '#/components/parameters/EdgeSignature'
        - $ref: '#/components/parameters/OptionalCorrelationId'
        - name: branchId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Limited search results; phone values are masked and are not used to establish identity.
          content:
            application/json:
              schema:
                $ref: '../events/device/windows-edge-contract.v1.schema.json#/$defs/EdgeCustomerSearchPage'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Installation request quota exceeded; retry later. }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v2/edge/customers/{customerId}:
    get:
      operationId: readEdgeCustomerProfile
      summary: Read a branch-authorized customer profile
      description: Requires the customer.lookup.limited IAM permission and a household relationship established through an active Wallet card assignment.
      security:
        - edgeHmacSignature: []
          edgeOperatorBearer: []
      parameters:
        - $ref: '#/components/parameters/EdgeInstallationId'
        - $ref: '#/components/parameters/EdgeKeyId'
        - $ref: '#/components/parameters/EdgeSignature'
        - $ref: '#/components/parameters/OptionalCorrelationId'
        - name: customerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: branchId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Minimal online profile and masked phone. Uploaded avatar bytes and phone number are omitted.
          content:
            application/json:
              schema:
                $ref: '../events/device/windows-edge-contract.v1.schema.json#/$defs/EdgeCustomerProfile'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { description: Installation request quota exceeded; retry later. }
        '503': { $ref: '#/components/responses/Unavailable' }
    patch:
      operationId: updateEdgeCustomerProfile
      summary: Apply a versioned, idempotent customer profile update
      description: Requires customer.profile.manage for the installation branch. Branch scope is checked against the installation registry; expectedVersion conflicts return 409 and the client must reload before retrying.
      security:
        - edgeHmacSignature: []
          edgeOperatorBearer: []
      parameters:
        - $ref: '#/components/parameters/EdgeInstallationId'
        - $ref: '#/components/parameters/EdgeKeyId'
        - $ref: '#/components/parameters/EdgeSignature'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OptionalCorrelationId'
        - name: customerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../events/device/windows-edge-contract.v1.schema.json#/$defs/EdgeCustomerProfilePatchRequest'
      responses:
        '200':
          description: Profile version and masked phone only.
          content:
            application/json:
              schema:
                $ref: '../events/device/windows-edge-contract.v1.schema.json#/$defs/EdgeProfileMutationResult'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { description: Installation request quota exceeded; retry later. }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v2/edge/households/{householdId}:
    get:
      operationId: readEdgeHousehold
      summary: Read a household and its active members for the installed branch
      description: Requires customer.family.read. The installation branch and Wallet mapping are validated server-side.
      security:
        - edgeHmacSignature: []
          edgeOperatorBearer: []
      parameters:
        - $ref: '#/components/parameters/EdgeInstallationId'
        - $ref: '#/components/parameters/EdgeKeyId'
        - $ref: '#/components/parameters/EdgeSignature'
        - $ref: '#/components/parameters/OptionalCorrelationId'
        - name: householdId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: branchId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Household and active member data with record versions.
          content:
            application/json:
              schema:
                $ref: '../events/device/windows-edge-contract.v1.schema.json#/$defs/EdgeHouseholdRead'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { description: Installation request quota exceeded; retry later. }
        '503': { $ref: '#/components/responses/Unavailable' }
    patch:
      operationId: updateEdgeHousehold
      summary: Apply a versioned, idempotent household update
      description: Requires customer.family.manage for the installation branch. expectedVersion conflicts return 409.
      security:
        - edgeHmacSignature: []
          edgeOperatorBearer: []
      parameters:
        - $ref: '#/components/parameters/EdgeInstallationId'
        - $ref: '#/components/parameters/EdgeKeyId'
        - $ref: '#/components/parameters/EdgeSignature'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OptionalCorrelationId'
        - name: householdId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../events/device/windows-edge-contract.v1.schema.json#/$defs/EdgeHouseholdPatchRequest'
      responses:
        '200':
          description: Updated household ID and version only.
          content:
            application/json:
              schema:
                $ref: '../events/device/windows-edge-contract.v1.schema.json#/$defs/EdgeHouseholdMutationResult'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { description: Installation request quota exceeded; retry later. }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v2/edge/households/{householdId}/members:
    post:
      operationId: addEdgeHouseholdMember
      summary: Add a household member with an idempotency key
      description: Requires customer.family.manage for the installation branch. New members do not receive a card assignment automatically.
      security:
        - edgeHmacSignature: []
          edgeOperatorBearer: []
      parameters:
        - $ref: '#/components/parameters/EdgeInstallationId'
        - $ref: '#/components/parameters/EdgeKeyId'
        - $ref: '#/components/parameters/EdgeSignature'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OptionalCorrelationId'
        - name: householdId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../events/device/windows-edge-contract.v1.schema.json#/$defs/EdgeHouseholdMemberCreateRequest'
      responses:
        '201':
          description: New member ID, household ID and record version only.
          content:
            application/json:
              schema:
                $ref: '../events/device/windows-edge-contract.v1.schema.json#/$defs/EdgeHouseholdMemberMutationResult'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { description: Installation request quota exceeded; retry later. }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v2/edge/cards/assignments:
    post:
      operationId: assignEdgeCard
      summary: Assign a verified physical card to a household or one member
      description: Requires card.assign. Branch and organization come from the registered installation; Wallet verifies the household, member, physical-card verification, expectedVersion and unique active allocation. An empty or null memberId means a shared household card.
      security:
        - edgeHmacSignature: []
          edgeOperatorBearer: []
      parameters:
        - $ref: '#/components/parameters/EdgeInstallationId'
        - $ref: '#/components/parameters/EdgeKeyId'
        - $ref: '#/components/parameters/EdgeSignature'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OptionalCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../events/device/windows-edge-contract.v1.schema.json#/$defs/EdgeCardAssignmentRequest'
      responses:
        '201':
          description: Assignment and card verification state; physical UID is omitted.
          content:
            application/json:
              schema:
                $ref: '../events/device/windows-edge-contract.v1.schema.json#/$defs/EdgeCardAssignmentResult'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { description: Installation request quota exceeded; retry later. }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v2/edge/cards/{cardId}/block:
    post:
      operationId: blockEdgeCard
      summary: Block a physical card in the installation branch
      description: Requires card.inventory.manage. Wallet checks the expected record version, records append-only card history and returns only a masked identifier.
      security:
        - edgeHmacSignature: []
          edgeOperatorBearer: []
      parameters:
        - $ref: '#/components/parameters/EdgeInstallationId'
        - $ref: '#/components/parameters/EdgeKeyId'
        - $ref: '#/components/parameters/EdgeSignature'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OptionalCorrelationId'
        - name: cardId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../events/device/windows-edge-contract.v1.schema.json#/$defs/EdgeCardCommandRequest'
      responses:
        '200':
          description: Blocked card state and new record version; physical UID is omitted.
          content:
            application/json:
              schema:
                $ref: '../events/device/windows-edge-contract.v1.schema.json#/$defs/EdgeCardBlockResult'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { description: Installation request quota exceeded; retry later. }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v2/edge/cards/{cardId}/replacement-requests:
    post:
      operationId: requestEdgeCardReplacement
      summary: Create an idempotent replacement request for the mapped household
      description: Requires card.inventory.manage. Household identity is resolved from the active Wallet mapping for the installation branch; callers cannot supply another household ID. Wallet checks the expected card version and emits an append-only lifecycle event.
      security:
        - edgeHmacSignature: []
          edgeOperatorBearer: []
      parameters:
        - $ref: '#/components/parameters/EdgeInstallationId'
        - $ref: '#/components/parameters/EdgeKeyId'
        - $ref: '#/components/parameters/EdgeSignature'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OptionalCorrelationId'
        - name: cardId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../events/device/windows-edge-contract.v1.schema.json#/$defs/EdgeCardCommandRequest'
      responses:
        '201':
          description: Lifecycle request identifier and status.
          content:
            application/json:
              schema:
                $ref: '../events/device/windows-edge-contract.v1.schema.json#/$defs/EdgeCardReplacementRequestResult'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { description: Installation request quota exceeded; retry later. }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v2/edge/balances/reconcile:
    post:
      operationId: reconcilePhysicalCardBalance
      summary: Confirm the balance read directly from a verified physical card
      description: HMAC is calculated over the exact raw body. The installation and branch are resolved from the registered Edge identity; no raw card UID is accepted. Wallet validates card ownership at observedAt and appends an immutable reconciliation record.
      security:
        - edgeHmacSignature: []
      parameters:
        - name: x-edge-installation-id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: x-edge-key-id
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: x-edge-signature
          in: header
          required: true
          schema: { type: string, pattern: '^sha256=[a-f0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  sourceInstanceId,
                  branchId,
                  snapshotId,
                  snapshotVersion,
                  cardId,
                  householdId,
                  memberId,
                  localSequence,
                  balanceRial,
                  currencyCode,
                  observedAt,
                ]
              properties:
                sourceInstanceId: { type: string, format: uuid }
                branchId: { type: string, format: uuid }
                snapshotId: { type: string, format: uuid }
                snapshotVersion: { type: string, minLength: 1, maxLength: 120 }
                cardId: { type: string, format: uuid }
                householdId: { type: string, format: uuid }
                memberId: { type: [string, 'null'], format: uuid }
                localSequence: { type: integer, minimum: 0, maximum: 9007199254740991 }
                balanceRial: { type: integer, minimum: 0, maximum: 9007199254740991 }
                currencyCode: { type: string, const: IRR }
                observedAt: { type: string, format: date-time }
              additionalProperties: false
      responses:
        '200':
          description: Physical card balance reconciliation result.
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    snapshotId,
                    cardId,
                    balanceRial,
                    differenceRial,
                    freshness,
                    observedAt,
                    duplicate,
                  ]
                properties:
                  snapshotId: { type: string, format: uuid }
                  cardId: { type: string, format: uuid }
                  balanceRial: { type: [integer, 'null'], minimum: 0, maximum: 9007199254740991 }
                  differenceRial:
                    {
                      type: [integer, 'null'],
                      minimum: -9007199254740991,
                      maximum: 9007199254740991,
                    }
                  freshness: { type: string, enum: [fresh, pending_sync, stale, unknown] }
                  observedAt: { type: string, format: date-time }
                  duplicate: { type: boolean }
                additionalProperties: false
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Installation rate limit exceeded; retry after reconnect. }
        '409':
          {
            description: Snapshot is older than an applied transaction or physical card ownership cannot be verified at read time.,
          }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v1/operations/edge-sync/organizations/{organizationId}/branches/{branchId}:
    get:
      operationId: getBranchEdgeSyncStatus
      summary: Read branch installation, snapshot, import, and outbox delivery status
      security:
        - internalGatewayToken: []
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: branchId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          {
            description: Branch-scoped installations,
            latest snapshots and event-delivery counters.,
          }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v1/operations/edge-sync/organizations/{organizationId}/branches/{branchId}/dead-letters/{eventId}/replay:
    post:
      operationId: replayBranchEdgeDeadLetter
      summary: Requeue the original immutable Edge event with its existing event identity
      description: Requires a review reason, actor, correlation, and idempotency key. The original outbox envelope and event ID are preserved; only delivery state is reset. Replay attempts are audited append-only.
      security:
        - internalGatewayToken: []
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: branchId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 500 }
              additionalProperties: false
      responses:
        '200': { description: Original event requeued with its existing eventId. }
        '400': { description: Reason or command metadata is invalid. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Dead-letter event was not found in this branch. }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v2/edge/snapshot:
    get:
      operationId: getSignedBranchEdgeSnapshotPage
      summary: Fetch a resumable, signed immutable offline snapshot for the installation branch
      description: Sign the empty request body with the installation key identified by x-edge-key-id. The signed response includes signingKeyId in its canonical JSON. Keep the previous complete snapshot until every new page has been verified.
      security:
        - edgeHmacSignature: []
      parameters:
        - name: x-edge-installation-id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: x-edge-key-id
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: x-edge-signature
          in: header
          required: true
          schema: { type: string, pattern: '^sha256=[a-f0-9]{64}$' }
        - name: branchId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 1024 }
      responses:
        '200':
          description: Signed snapshot page; PII is omitted, and pricing execution remains disabled until Windows golden vectors are approved.
          content:
            application/json:
              schema:
                $ref: '../events/device/windows-edge-contract.v1.schema.json#/$defs/EdgeSnapshotPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410':
          {
            description: Snapshot cursor is expired; request a new complete snapshot and retain the previous one until it succeeds.,
          }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    internalGatewayToken:
      type: apiKey
      in: header
      name: x-funtino-service-token
      description: Runtime secret held only by the API Gateway. Pair with x-funtino-service-id=api-gateway.
    deviceWebhookSignature:
      type: apiKey
      in: header
      name: x-device-signature
      description: sha256=<hex HMAC-SHA256 of the exact raw JSON body>.
    edgeHmacSignature:
      type: apiKey
      in: header
      name: x-edge-signature
      description: sha256=<hex HMAC-SHA256 of the exact raw JSON body; pair with installation ID and key ID headers.
    edgeOperatorBearer:
      type: http
      scheme: bearer
      bearerFormat: FuntinoEdgeOperatorToken
      description: Short-lived, branch-scoped opaque token issued by API Gateway after IAM permission evaluation.
  parameters:
    EdgeInstallationId:
      name: x-edge-installation-id
      in: header
      required: true
      schema: { type: string, format: uuid }
    EdgeKeyId:
      name: x-edge-key-id
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 120 }
    EdgeSignature:
      name: x-edge-signature
      in: header
      required: true
      schema: { type: string, pattern: '^sha256=[a-f0-9]{64}$' }
    ServiceId:
      name: x-funtino-service-id
      in: header
      required: true
      schema: { type: string, const: api-gateway }
    ActorUserId:
      name: x-funtino-actor-user-id
      in: header
      required: true
      schema: { type: string, format: uuid }
    CorrelationId:
      name: x-correlation-id
      in: header
      required: true
      schema: { type: string, format: uuid }
    OptionalCorrelationId:
      name: x-correlation-id
      in: header
      required: false
      description: If omitted, the service request ID is used as the correlation ID.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"?[1-9][0-9]*"?$' }
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BranchId:
      name: branchId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    EdgeOperatorPermission:
      type: string
      enum:
        [
          card.inventory.read,
          card.inventory.manage,
          card.assign,
          card.transfer,
          card.unassign,
          customer.lookup.limited,
          customer.provisional.create,
          customer.family.read,
          customer.family.manage,
          customer.profile.manage,
        ]
    DeviceStatus:
      type: string
      enum: [active, suspended, retired]
    DeviceType:
      type: string
      enum: [rfid_reader, terminal, access_gate, other]
    HealthState:
      type: string
      enum: [unknown, online, degraded, stale, offline]
    DeviceRegistration:
      type: object
      additionalProperties: false
      required: [adapterKey, externalDeviceId, displayName, deviceType]
      properties:
        adapterKey:
          { type: string, minLength: 1, maxLength: 60, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]*$' }
        externalDeviceId: { type: string, minLength: 1, maxLength: 160 }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        deviceType: { $ref: '#/components/schemas/DeviceType' }
        reason: { type: string, maxLength: 500 }
    DeviceUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        status: { $ref: '#/components/schemas/DeviceStatus' }
        reason: { type: string, maxLength: 500 }
    DeviceCommandResult:
      type: object
      additionalProperties: false
      required: [deviceId, status, version]
      properties:
        deviceId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/DeviceStatus' }
        version: { type: integer, minimum: 1 }
    Device:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          branchId,
          adapterKey,
          externalDeviceId,
          displayName,
          deviceType,
          status,
          healthState,
          latestReportedState,
          latestObservedAt,
          freshnessSeconds,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        adapterKey: { type: string }
        externalDeviceId: { type: string }
        displayName: { type: string }
        deviceType: { $ref: '#/components/schemas/DeviceType' }
        status: { $ref: '#/components/schemas/DeviceStatus' }
        healthState: { $ref: '#/components/schemas/HealthState' }
        latestReportedState: { type: [string, 'null'], enum: [online, degraded, offline, null] }
        latestObservedAt: { type: [string, 'null'], format: date-time }
        freshnessSeconds: { type: [integer, 'null'], minimum: 0 }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DevicePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Device' }
        nextCursor: { type: [string, 'null'], format: uuid }
    HealthObservationInput:
      type: object
      additionalProperties: false
      required:
        [
          organizationId,
          adapterKey,
          externalDeviceId,
          externalObservationId,
          reportedState,
          observedAt,
        ]
      properties:
        organizationId: { type: string, format: uuid }
        adapterKey: { type: string, minLength: 1, maxLength: 60 }
        externalDeviceId: { type: string, minLength: 1, maxLength: 160 }
        externalObservationId: { type: string, minLength: 1, maxLength: 160 }
        reportedState: { type: string, enum: [online, degraded, offline] }
        observedAt: { type: string, format: date-time }
    HealthObservationResult:
      type: object
      additionalProperties: false
      required: [accepted, duplicate, deviceId, observationId, observedAt, isLatest]
      properties:
        accepted: { const: true }
        duplicate: { type: boolean }
        deviceId: { type: string, format: uuid }
        observationId: { type: string, format: uuid }
        observedAt: { type: string, format: date-time }
        isLatest: { type: boolean }
    DeviceTransactionInput:
      type: object
      required:
        [
          eventId,
          organizationId,
          branchId,
          externalCardId,
          transactionKind,
          amountMinor,
          currency,
          occurredAt,
        ]
      properties:
        eventId: { type: string, minLength: 1, maxLength: 160 }
        organizationId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        externalCardId: { type: string, minLength: 1, maxLength: 160 }
        transactionKind: { type: string, enum: [top_up, spend, refund, adjustment] }
        amountMinor: { type: integer }
        currency: { type: string, minLength: 3, maxLength: 3 }
        occurredAt: { type: string, format: date-time }
        sourceDeviceId: { type: string, maxLength: 160 }
    TransactionImportResult:
      type: object
      additionalProperties: false
      required: [accepted, duplicate, externalEventId, transactionId]
      properties:
        accepted: { const: true }
        duplicate: { type: boolean }
        externalEventId: { type: string }
        transactionId: { type: string, format: uuid }
    Error:
      type: object
      properties:
        statusCode: { type: integer }
        message: { type: string }
  responses:
    InvalidRequest:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Internal service or device signature is invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Device or branch was not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Identity, version, status transition, or idempotency key conflicts with current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Database, configuration, or organization/branch owner is unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
