      properties:
        householdId: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        memberId: { type: [string, 'null'], format: uuid }
        balanceRial: { type: [integer, 'null'] }
        lastConfirmedSnapshotAt: { type: [string, 'null'], format: date-time }
        lastAppliedEventId: { type: [string, 'null'], format: uuid }
