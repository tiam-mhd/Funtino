              promotionId: { type: [string, 'null'] }
              ruleId: { type: [string, 'null'] }
              pricingVersion: { type: [string, 'null'] }
              reversalOfEntryId: { type: [string, 'null'], format: uuid }
              occurredAt: { type: string, format: date-time }
