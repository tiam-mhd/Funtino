    CardLifecycleRequestStatus:
      type: string
      enum: [requested, in_review, approved, rejected, completed]
    CardLifecycleRequest:
      type: object
      additionalProperties: false
      required: [id, cardId, replacementCardId, householdId, memberId, action, status, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        replacementCardId: { type: [string, 'null'], format: uuid }
        householdId: { type: string, format: uuid }
        memberId: { type: [string, 'null'], format: uuid }
