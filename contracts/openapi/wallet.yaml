      allOf:
        - $ref: '#/components/schemas/CardLifecycleRequest'
        - type: object
          required: [duplicate]
          properties:
            duplicate: { type: boolean }
    BranchCardLifecycleRequest:
      allOf:
        - $ref: '#/components/schemas/CardLifecycleRequest'
        - type: object
          required: [organizationId, branchId, maskedIdentifier]
          properties:
            organizationId: { type: string, format: uuid }
            branchId: { type: string, format: uuid }
