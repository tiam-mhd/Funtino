        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, eventId, cardId, householdId, memberId, deviceId, transactionKind, amountRial, grossAmountRial, discountAmountRial, netAmountRial, currencyCode, promotionId, ruleId, pricingVersion, reversalOfEntryId, occurredAt, status]
            properties:
              id: { type: string, format: uuid }
              eventId: { type: string, format: uuid }
