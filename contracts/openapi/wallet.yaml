openapi: 3.1.0
info:
  title: Funtino Wallet Owner API
  version: 0.1.0
  description: Private Wallet owner API for physical-card assignment, append-only card ledger, offline Edge ingestion results, and customer-authorized balance projections.
servers:
  - url: http://wallet:4070
    description: Private service network only
security:
  - WalletServiceToken: []
    ServiceIdentity: []
paths:
  /internal/v1/organizations/{organizationId}/branches/{branchId}/cards:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/BranchId'
    get:
      operationId: listBranchCardInventory
      summary: List branch card inventory
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CardInventoryStatus'
        - name: cursor
          in: query
          schema:
            type: string
            format: uuid
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Inventory page. Physical identifiers are always masked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardInventoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    post:
      operationId: registerBranchCard
      summary: Register a physical card in branch inventory
      parameters:
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCardRequest'
      responses:
        '201':
          description: Card registered; provider verification remains unknown until confirmed by an approved adapter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardInventory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /internal/v1/organizations/{organizationId}/branches/{branchId}/cards/{cardId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/CardId'
    get:
      operationId: getBranchCardInventoryItem
      summary: Read one card inventory item within its organization and branch
      responses:
        '200':
          description: Card inventory item. Physical identifiers are always masked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardInventory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: changeBranchCardInventoryStatus
      summary: Change an inventory status with optimistic concurrency
      parameters:
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
          description: Current card inventory version returned by Wallet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeCardStatusRequest'
      responses:
        '200':
          description: Updated inventory item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardInventory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /internal/v1/organizations/{organizationId}/branches/{branchId}/cards/{cardId}/assignments:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/CardId'
    post:
      operationId: assignCardToHouseholdAtBranch
      summary: Assign one verified in-stock card to one active household at its fixed branch
      parameters:
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignCardRequest' }
      responses:
        '201':
          description: Active household/branch assignment created atomically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardAssignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /internal/v1/organizations/{organizationId}/branches/{branchId}/card-assignments:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/BranchId'
    get:
      operationId: listBranchCardAssignments
      summary: List active household card assignments for a branch
      parameters:
        - name: cursor
          in: query
          schema: { type: string, format: uuid }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Assignment summaries. Household IDs are opaque; no member or financial data is returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardAssignmentPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /internal/v1/households/{householdId}/card-assignments:
    get:
      operationId: listHouseholdCardAssignments
      summary: List active card assignments for a household
      parameters:
        - name: householdId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          schema: { type: string, format: uuid }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Current active assignment page only; monetary balances and unverified device activity are excluded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardAssignmentPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /internal/v1/organizations/{organizationId}/branches/{branchId}/card-assignments/{assignmentId}/transfer:
    post:
      operationId: transferCardAssignmentWithinBranch
      summary: Atomically end an assignment and assign its card to another household in the same branch
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/BranchId'
        - name: assignmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferCardRequest' }
      responses:
        '200':
          description: Assignment transferred with immutable history for both households.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardAssignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /internal/v1/assignments/{assignmentId}:
    get:
      operationId: getActiveCardAssignment
      summary: Read one active assignment for a trusted Gateway authorization decision
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Active assignment summary; never includes the physical card identifier.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardAssignment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /internal/v1/organizations/{organizationId}/branches/{branchId}/card-assignments/{assignmentId}/cancel:
    post:
      operationId: cancelCardAssignment
      summary: Cancel an active assignment with a reason
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/BranchId'
        - name: assignmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelCardRequest' }
      responses:
        '200':
          { description: Assignment ended; card remains unavailable unless verified and eligible. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /internal/v1/legacy-device-events:
    post:
      operationId: stageLegacyDeviceTransaction
      summary: Idempotently stage a legacy v1 device event for history reconciliation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, branchId, payload]
              properties:
                organizationId: { type: string, format: uuid }
                branchId: { type: string, format: uuid }
                payload: { type: object }
              additionalProperties: false
      responses:
        '201': { description: Accepted or duplicate legacy event staged for mapping. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v1/households/{householdId}/cards/{cardId}/summary:
    get:
      operationId: getHouseholdCardLedgerSummary
      parameters:
        - name: householdId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Card balance with freshness; unknown or stale balances are not confirmed current values.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardLedgerSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
  /internal/v1/households/{householdId}/cards/{cardId}/transactions:
    get:
      operationId: listHouseholdCardLedgerTransactions
      parameters:
        - name: householdId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CardId'
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: kind
          in: query
          schema: { type: string, enum: [top_up, spend, refund, adjustment, issuance, card_replacement] }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Cursor-paged append-only card transactions scoped to the supplied household assignment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardLedgerTransactionPage' }
        '404': { $ref: '#/components/responses/NotFound' }
  /internal/v1/households/{householdId}/cards/{cardId}/lifecycle-requests:
    parameters:
      - name: householdId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/CardId'
    get:
      operationId: listHouseholdCardLifecycleRequests
      description: Internal Gateway call after session and household authorization; only requests for the supplied card are returned.
      responses:
        '200':
          description: Up to 100 lifecycle requests for the authorized household card.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CardLifecycleRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createHouseholdCardLifecycleRequest
      parameters:
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, reason]
              properties:
                action: { type: string, enum: [lost, replacement] }
                reason: { type: string, minLength: 8, maxLength: 500 }
      responses:
        '201':
          description: Request, append-only history and outbox event are committed together.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardLifecycleRequestCommandResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v1/organizations/{organizationId}/branches/{branchId}/card-lifecycle-requests:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/BranchId'
    get:
      operationId: listBranchCardLifecycleRequests
      description: Branch-scoped to an active organization and branch. Card identifiers are masked.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CardLifecycleRequestStatus' }
        - name: cursor
          in: query
          schema: { type: string, format: uuid }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Branch lifecycle request page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BranchCardLifecycleRequestPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /internal/v1/organizations/{organizationId}/branches/{branchId}/card-lifecycle-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/BranchId'
      - name: requestId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: transitionBranchCardLifecycleRequest
      description: Requires branch management authorization at Gateway, Wallet revalidates the active branch, and approval blocks the reported physical card.
      parameters:
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, reason]
              properties:
                status: { type: string, enum: [in_review, approved, rejected, completed] }
                reason: { type: string, minLength: 8, maxLength: 500 }
      responses:
        '200':
          description: Status, immutable audit history and outbox event committed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardLifecycleRequestCommandResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /internal/v2/edge/balances/reconcile:
    post:
      operationId: reconcileEdgePhysicalBalance
      summary: Validate and persist a balance snapshot from a physically read card
      description: Device Integration credential only. The reconciliation record is append-only and the projection does not derive a balance from partial ledger history.
      security:
        - WalletDeviceIntegrationToken: []
          DeviceIntegrationIdentity: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshotId, sourceInstanceId, organizationId, branchId, cardId, householdId, memberId, snapshotVersion, localSequence, balanceRial, currencyCode, observedAt]
              properties:
                snapshotId: { type: string, format: uuid }
                sourceInstanceId: { type: string, format: uuid }
                organizationId: { type: string, format: uuid }
                branchId: { type: string, format: uuid }
                cardId: { type: string, format: uuid }
                householdId: { type: string, format: uuid }
                memberId: { type: [string, 'null'], format: uuid }
                snapshotVersion: { type: string, minLength: 1, maxLength: 120 }
                localSequence: { type: integer, minimum: 0, maximum: 9007199254740991 }
                balanceRial: { type: integer, minimum: 0, maximum: 9007199254740991 }
                currencyCode: { type: string, const: IRR }
                observedAt: { type: string, format: date-time }
              additionalProperties: false
      responses:
        '200':
          description: Balance projection updated after scope, verification, and historical ownership checks.
          content:
            application/json:
              schema:
                type: object
                required: [snapshotId, cardId, balanceRial, differenceRial, freshness, observedAt, duplicate]
                properties:
                  snapshotId: { type: string, format: uuid }
                  cardId: { type: string, format: uuid }
                  balanceRial: { type: [integer, 'null'], minimum: 0, maximum: 9007199254740991 }
                  differenceRial: { type: [integer, 'null'], minimum: -9007199254740991, maximum: 9007199254740991 }
                  freshness: { type: string, enum: [fresh, pending_sync, stale, unknown] }
                  observedAt: { type: string, format: date-time }
                  duplicate: { type: boolean }
                additionalProperties: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v1/edge/operations/organizations/{organizationId}/branches/{branchId}/review-summary:
    get:
      operationId: getBranchEdgeReviewSummary
      summary: Count Edge ledger events that require data correction or investigation
      security:
        - WalletDeviceIntegrationToken: []
          DeviceIntegrationIdentity: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200': { description: Counts by safe error code. No card identifiers or transaction payloads are returned. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /internal/v1/organizations/{organizationId}/branches/{branchId}/edge-card-mappings:
    get:
      operationId: listVerifiedBranchEdgeCardMappings
      summary: Return minimal verified card-owner mappings for a registered Edge snapshot
      description: Internal Device Integration credential only. Physical card identifiers are returned solely to build the signed offline mapping and must never be logged or exposed to customer routes.
      security:
        - WalletDeviceIntegrationToken: []
          DeviceIntegrationIdentity: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Verified assigned cards only, scoped to the requested organization and branch.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [cardId, externalCardId, householdId, memberId]
                  properties:
                    cardId: { type: string, format: uuid }
                    externalCardId: { type: string, maxLength: 160 }
                    householdId: { type: string, format: uuid }
                    memberId: { type: [string, 'null'], format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
components:
  securitySchemes:
    WalletServiceToken:
      type: apiKey
      in: header
      name: x-funtino-service-token
    ServiceIdentity:
      type: apiKey
      in: header
      name: x-funtino-service-id
    WalletDeviceIntegrationToken:
      type: apiKey
      in: header
      name: x-funtino-service-token
    DeviceIntegrationIdentity:
      type: apiKey
      in: header
      name: x-funtino-service-id
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BranchId:
      name: branchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActorUserId:
      name: x-funtino-actor-user-id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: x-correlation-id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CardInventoryStatus:
      type: string
      enum: [in_stock, assigned, blocked, retired]
    CardManualStatusTarget:
      type: string
      enum: [in_stock, blocked, retired]
    CardVerificationStatus:
      type: string
      enum: [unknown, verified, rejected]
    RegisterCardRequest:
      type: object
      additionalProperties: false
      required: [externalCardId]
      properties:
        externalCardId:
          type: string
          minLength: 1
          maxLength: 160
          writeOnly: true
          description: Private physical identifier; never returned in API responses, events or audit snapshots.
        reason:
          type: string
          maxLength: 500
    ChangeCardStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/CardManualStatusTarget'
        reason:
          type: string
          maxLength: 500
    CardInventory:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          branchId,
          maskedIdentifier,
          status,
          verificationStatus,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        maskedIdentifier:
          type: string
          description: Fixed mask; at most the final four characters are exposed.
        status:
          $ref: '#/components/schemas/CardInventoryStatus'
        verificationStatus:
          $ref: '#/components/schemas/CardVerificationStatus'
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CardInventoryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CardInventory'
        nextCursor:
          type: [string, 'null']
          format: uuid
    AssignCardRequest:
      type: object
      additionalProperties: false
      required: [householdId, reason]
      properties:
        householdId:
          {
            type: string,
            format: uuid,
            description: Opaque ID validated by Customer & Household owner.,
          }
        memberId:
          type: [string, 'null']
          format: uuid
          description: Null or omitted means a shared household card; an ID is validated by Customer & Household.
        reason: { type: string, minLength: 8, maxLength: 500 }
    TransferCardRequest:
      type: object
      additionalProperties: false
      required: [householdId, reason]
      properties:
        householdId:
          {
            type: string,
            format: uuid,
            description: New household in the assignment's existing branch.,
          }
        memberId:
          type: [string, 'null']
          format: uuid
          description: Null or omitted means a shared household card; an ID is validated by Customer & Household.
        reason: { type: string, minLength: 8, maxLength: 500 }
    CancelCardRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 8, maxLength: 500 }
    CardAssignment:
      type: object
      additionalProperties: false
      required:
        [
          id,
          cardId,
          organizationId,
          branchId,
          householdId,
          memberId,
          maskedIdentifier,
          status,
          verificationStatus,
          assignedAt,
        ]
      properties:
