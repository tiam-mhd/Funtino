            type:
              const: organization
            organizationId:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required: [type, organizationId, branchId]
          properties:
            type:
              const: branch
            organizationId:
              type: string
              format: uuid
            branchId:
              type: string
              format: uuid
    OperationsScopeOption:
      type: object
      additionalProperties: false
      required: [scope, organization]
      properties:
        scope:
          $ref: '#/components/schemas/OperationsTenantScope'
        organization:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        branch:
          type: object
          additionalProperties: false
          required: [id, name, city]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            city:
              type: string
    OperationsScopesSuccess:
      type: object
      required: [status, data, meta]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [items, policyVersion]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/OperationsScopeOption'
            policyVersion:
              type: integer
              minimum: 1
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    OperationsScopeSelectionRequest:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope:
          $ref: '#/components/schemas/OperationsTenantScope'
    OperationsScopeSelectionSuccess:
      type: object
      required: [status, data, meta]
      properties:
        status:
          type: string
          enum: [success]
        data:
          allOf:
            - $ref: '#/components/schemas/OperationsScopeOption'
            - type: object
              required: [policyVersion]
              properties:
                policyVersion:
                  type: integer
                  minimum: 1
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AccessMembershipSummary:
      type: object
      required: [membershipId, status, scope, role, version]
      properties:
        membershipId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, active, suspended, revoked]
        scope:
          $ref: '#/components/schemas/AccessScope'
        role:
          $ref: '#/components/schemas/RoleSummary'
        version:
          type: integer
          minimum: 1
    StaffInvitationCreate:
      type: object
      additionalProperties: false
      required: [phoneE164, scope, roleId, reason]
      properties:
        phoneE164:
          type: string
          pattern: '^[+][1-9][0-9]{7,14}$'
          writeOnly: true
        scope:
          $ref: '#/components/schemas/AccessScope'
        roleId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 8
          maxLength: 500
    StaffInvitationSummary:
      type: object
      required: [id, membershipId, status, maskedPhone, scope, role, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        membershipId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
        maskedPhone:
          type: string
        scope:
          $ref: '#/components/schemas/AccessScope'
        role:
          $ref: '#/components/schemas/RoleSummary'
        expiresAt:
          type: string
          format: date-time
    ScopedInvitationsSuccess:
      type: object
      required: [status, data, meta]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [data, nextCursor, policyVersion]
          properties:
            data:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/StaffInvitationSummary'
                  - type: object
                    required: [isExpired, roleChanged]
                    properties:
                      isExpired:
                        type: boolean
                      roleChanged:
                        type: boolean
            nextCursor:
              type: string
              format: uuid
              nullable: true
            policyVersion:
              type: integer
              minimum: 1
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    PendingInvitationsSuccess:
      type: object
      required: [status, data, meta]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                type: object
                required:
                  [
                    id,
                    scope,
                    organizationName,
                    branchName,
                    scopeStatus,
                    role,
                    maskedPhone,
                    expiresAt,
                    roleChanged,
                  ]
                properties:
                  id:
                    type: string
                    format: uuid
                  scope:
                    $ref: '#/components/schemas/AccessScope'
                  organizationName:
                    type: string
                    nullable: true
                    description: Current owner-service name; null when the owner resource no longer exists.
                  branchName:
                    type: string
                    nullable: true
                    description: Current owner-service branch name; null for organization invitations or a missing branch.
                  scopeStatus:
                    type: string
                    enum: [active, inactive, unavailable, system_only]
                    description: Current lifecycle confirmation from Organization & Branch; system_only marks a global scope intended for System Web. Acceptance is always revalidated server-side.
                  role:
                    $ref: '#/components/schemas/RoleSummary'
                  maskedPhone:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                  roleChanged:
                    type: boolean
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    InvitationMutationSuccess:
      type: object
      required: [status, data, meta]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [data, policyVersion]
          properties:
            data:
              $ref: '#/components/schemas/StaffInvitationSummary'
            policyVersion:
              type: integer
              minimum: 1
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AcceptedInvitationSuccess:
      type: object
      required: [status, data, meta]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [data, policyVersion]
          properties:
            data:
              type: object
              required: [membershipId, status, scope, role]
              properties:
                membershipId:
                  type: string
                  format: uuid
                status:
                  type: string
                  const: active
                scope:
                  $ref: '#/components/schemas/AccessScope'
                role:
                  $ref: '#/components/schemas/RoleSummary'
            policyVersion:
              type: integer
              minimum: 1
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    InvitationRevocationSuccess:
      type: object
      required: [status, data, meta]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [data, policyVersion]
          properties:
            data:
              type: object
              required: [id, membershipId, status]
              properties:
                id:
                  type: string
                  format: uuid
                membershipId:
                  type: string
                  format: uuid
                status:
                  type: string
                  const: revoked
            policyVersion:
              type: integer
              minimum: 1
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    PermissionOverrideCreate:
      type: object
      additionalProperties: false
      required: [permission, effect, scope, reason]
      properties:
        permission:
          type: string
          minLength: 1
          maxLength: 120
        effect:
          type: string
          enum: [allow, deny]
        scope:
          $ref: '#/components/schemas/AccessScope'
        resource:
          type: object
          required: [type, id]
          additionalProperties: false
          properties:
            type:
              type: string
              minLength: 1
              maxLength: 80
            id:
              type: string
              minLength: 1
              maxLength: 160
        expiresAt:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 8
          maxLength: 500
    PermissionOverrideSummary:
      type: object
      required:
        [
          kind,
          id,
          membershipId,
          permissionKey,
          effect,
          scope,
          startsAt,
          expiresAt,
          revokedAt,
          reason,
        ]
      properties:
        kind:
          type: string
          const: permission_override
        id:
          type: string
          format: uuid
        membershipId:
          type: string
          format: uuid
        permissionKey:
          type: string
        effect:
          type: string
          enum: [allow, deny]
        scope:
          $ref: '#/components/schemas/AccessScope'
        resource:
          type: object
          required: [type, id]
          properties:
            type:
              type: string
            id:
              type: string
        startsAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        reason:
          type: string
    PermissionOverrideListSuccess:
      type: object
      required: [status, data, meta]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [data, policyVersion]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/PermissionOverrideSummary'
            policyVersion:
              type: integer
              minimum: 1
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    PermissionOverrideMutationSuccess:
      type: object
      required: [status, data, meta]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [data, policyVersion]
          properties:
            data:
              $ref: '#/components/schemas/PermissionOverrideSummary'
            policyVersion:
              type: integer
              minimum: 1
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AccessAuditSuccess:
      type: object
      required: [status, data, meta]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [data, nextCursor, policyVersion]
          properties:
            data:
              type: array
              items:
                type: object
                required:
                  [
                    id,
                    actorType,
                    actorUserId,
                    actorLabel,
                    action,
                    targetType,
                    targetId,
                    scope,
                    reason,
                    beforeState,
                    afterState,
                    policyVersion,
                    correlationId,
                    outcome,
                    createdAt,
                  ]
                properties:
                  id:
                    type: string
                    format: uuid
                  actorType:
                    type: string
                    enum: [user, system]
                  actorUserId:
                    type: string
                    format: uuid
                    nullable: true
                  actorLabel:
                    type: string
                    nullable: true
                  action:
                    type: string
                  targetType:
                    type: string
                  targetId:
                    type: string
                  scope:
                    $ref: '#/components/schemas/AccessScope'
                  reason:
                    type: string
                  beforeState:
                    type: object
                    nullable: true
                    additionalProperties: true
                  afterState:
                    type: object
                    nullable: true
                    additionalProperties: true
                  policyVersion:
                    type: integer
                    minimum: 1
                    nullable: true
                  correlationId:
                    type: string
                    format: uuid
                  outcome:
                    type: string
                    enum: [succeeded, denied, failed]
                  createdAt:
                    type: string
                    format: date-time
            nextCursor:
              type: string
              maxLength: 128
              nullable: true
            policyVersion:
              type: integer
              minimum: 1
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 8
          maxLength: 500
    Error:
      type: object
      required: [status, error]
      properties:
        status:
          type: string
          enum: [error]
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
  responses:
    Unauthenticated:
      description: Authentication is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The current actor lacks the required permission or scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
