openapi: 3.1.0
info:
  title: Funtino API Gateway
  version: 0.1.0
  description: >-
    Public REST contract for customer, operations and system web apps. Operations marked
    x-funtino-availability: implemented are live; planned operations are not callable yet.
servers:
  - url: http://localhost:4000
security:
  - sessionCookie: []
paths:
  /health/live:
    get:
      operationId: healthLive
      security: []
      responses:
        '200':
          description: Service is alive.
  /health/ready:
    get:
      operationId: healthReady
      security: []
      responses:
        '200':
          description: Service readiness.
  /api/v1/auth/otp/request:
    post:
      operationId: requestOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '200':
          description: OTP challenge created.
          content:
            application/json:
              schema:
                type: object
                required: [status, data, meta]
                properties:
                  status:
                    type: string
                    enum: [success]
                  data:
                    $ref: '#/components/schemas/OtpChallengeResponse'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
      responses:
        '200':
          description: Session cookie is set. Global system administrators receive an MFA-pending session and must complete TOTP/recovery or enrollment before any application data is available.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpVerifySuccess' }
        '503':
          description: IAM could not classify the authenticated identity; no session is issued.
  /api/v1/auth/me:
    get:
      operationId: getMe
      responses:
        '200':
          description: Current user.
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        '200':
          description: Session revoked and cookie cleared.
  /api/v1/operations/mfa/status:
    get:
      x-funtino-availability: implemented
      operationId: getCurrentStaffMfaStatus
      responses:
        '200':
          description: MFA status for the authenticated staff account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStatusSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/operations/mfa/enrollment/start:
    post:
      x-funtino-availability: implemented
      operationId: startCurrentStaffMfaEnrollment
      responses:
        '200':
          description: A pending TOTP secret and URI. The response is no-store and must never be logged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollmentStartSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: MFA is already enabled.
  /api/v1/operations/mfa/enrollment/confirm:
    post:
      x-funtino-availability: implemented
      operationId: confirmCurrentStaffMfaEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCode'
      responses:
        '200':
          description: MFA enabled; ten single-use recovery codes are shown exactly once. Response is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaRecoveryCodesSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: MFA verification is temporarily locked.
  /api/v1/operations/mfa/step-up/verify:
    post:
      x-funtino-availability: implemented
      operationId: verifyCurrentStaffMfaStepUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaProof'
      responses:
        '200':
          description: Fresh MFA evidence attached to this server-side session for at most five minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStepUpSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: MFA verification is temporarily locked.
  /api/v1/operations/mfa/recovery-codes/regenerate:
    post:
      x-funtino-availability: implemented
      operationId: regenerateCurrentStaffMfaRecoveryCodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaProof'
      responses:
        '200':
          description: Previous unused codes are revoked; ten new codes are shown once. Response is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaRecoveryCodesSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: MFA verification is temporarily locked.
  /api/v1/operations/mfa/disable:
    post:
      x-funtino-availability: implemented
      operationId: disableCurrentStaffMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaProof'
      responses:
        '200':
          description: MFA disabled after current-factor verification; all session step-up evidence is invalidated.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: MFA verification is temporarily locked.
  /api/v1/operations/access-context:
    get:
      x-funtino-availability: implemented
      operationId: getOperationsAccessContext
      responses:
        '200':
          description: Non-revoked staff memberships and policy version available to the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsAccessContextSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Access policy service is unavailable; access must fail closed.
  /api/v1/operations/scopes:
    get:
      x-funtino-availability: implemented
      operationId: listCurrentOperationsScopes
      description: Returns only active organization or branch scopes derived from the current user's active IAM memberships and confirmed active owner-service records. Response is private and never cached.
      responses:
        '200':
          description: Current active scopes available to the authenticated operations user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsScopesSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          description: IAM or Organization & Branch could not confirm current scope state; access fails closed.
  /api/v1/operations/scope-selection:
    post:
      x-funtino-availability: implemented
      operationId: selectCurrentOperationsScope
      description: Revalidates that the requested tenant scope belongs to an active IAM membership and is backed by an active organization and, for branch scopes, an active branch with the requested parent. Successful user selections are audited. Every subsequent data request must still be independently authorized for its exact scope and permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationsScopeSelectionRequest'
      responses:
        '200':
          description: Scope revalidated and selection audit recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsScopeSelectionSuccess'
        '400':
          description: Invalid organization or branch scope format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: IAM, owner data, or audit storage is unavailable; selection is not accepted.
  /api/v1/system/health:
    get:
      x-funtino-availability: implemented
      operationId: readSystemOperationalHealth
      description: Requires an active session and the global system.health.read permission. Returns a restricted summary from the private Prometheus query API; internal target addresses and arbitrary query execution are never exposed.
      responses:
        '200':
          description: Current backend availability, aggregate HTTP telemetry, freshness and active operational alerts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Private telemetry source is not configured or is temporarily unavailable.
  /api/v1/system/organizations:
    get:
      x-funtino-availability: implemented
      operationId: listSystemOrganizations
      description: Returns only global-readable organizations or organization IDs authorized individually by Identity & Access. The service-owner data is never queried directly from this app.
      parameters:
        - $ref: '#/components/parameters/SystemCursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A keyset-paginated page of authorized organizations with their actual owner-service status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemOrganizationListSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Identity & Access or the Organization & Branch owner is unavailable; access fails closed.
    post:
      x-funtino-availability: implemented
      operationId: createSystemOrganization
      description: Requires organization.create at global scope, fresh MFA step-up, trusted browser origin and an auditable reason.
      parameters:
        - $ref: '#/components/parameters/SystemIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemOrganizationCreate'
      responses:
        '201':
          description: Organization created by the owner service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemOrganizationSuccess'
        '400':
          description: Invalid request.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Slug conflict or idempotency key conflict.
        '503':
          description: Identity & Access or the Organization & Branch owner is unavailable.
  /api/v1/system/organizations/{organizationId}:
    parameters:
      - $ref: '#/components/parameters/SystemOrganizationId'
    get:
      x-funtino-availability: implemented
      operationId: getSystemOrganization
      responses:
        '200':
          description: Authorized organization detail, including its actual lifecycle status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemOrganizationSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Organization not found.
        '503':
          description: Identity & Access or the Organization & Branch owner is unavailable.
    patch:
      x-funtino-availability: implemented
      operationId: updateSystemOrganization
      description: Requires organization.update at this organization scope, fresh MFA step-up, a reason and optimistic concurrency.
      parameters:
        - $ref: '#/components/parameters/IfMatchVersion'
        - $ref: '#/components/parameters/SystemIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemOrganizationUpdate'
      responses:
        '200':
          description: Updated organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemOrganizationSuccess'
        '400':
          description: Invalid request.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Organization not found.
        '409':
          description: Slug conflict, stale version or idempotency conflict.
        '503':
          description: Identity & Access or the Organization & Branch owner is unavailable.
  /api/v1/system/organizations/{organizationId}/status:
    parameters:
      - $ref: '#/components/parameters/SystemOrganizationId'
    post:
      x-funtino-availability: implemented
      operationId: changeSystemOrganizationStatus
      description: This management surface supports reversible active/suspended transitions only. Archiving is terminal and is not offered here. Requires organization.update, fresh MFA step-up and a reason.
      parameters:
        - $ref: '#/components/parameters/IfMatchVersion'
        - $ref: '#/components/parameters/SystemIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemResourceStatusChange'
      responses:
        '200':
          description: Updated actual owner-service status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemOrganizationSuccess'
        '400':
          description: Invalid request.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Organization not found.
        '409':
          description: Invalid lifecycle transition, stale version or idempotency conflict.
        '503':
          description: Identity & Access or the Organization & Branch owner is unavailable.
  /api/v1/system/organizations/{organizationId}/branches:
    parameters:
      - $ref: '#/components/parameters/SystemOrganizationId'
    get:
      x-funtino-availability: implemented
      operationId: listSystemOrganizationBranches
      description: Requires branch.read for the requested organization scope; owner service enforces the parent relationship.
      parameters:
        - $ref: '#/components/parameters/SystemCursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A paginated page of branches with actual lifecycle status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemBranchListSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Organization not found.
        '503':
          description: Identity & Access or the Organization & Branch owner is unavailable.
    post:
      x-funtino-availability: implemented
      operationId: createSystemOrganizationBranch
      description: Requires branch.create at the organization scope, fresh MFA step-up, a reason and trusted browser origin.
      parameters:
        - $ref: '#/components/parameters/SystemIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemBranchCreate'
      responses:
        '201':
          description: Branch created by the owner service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemBranchSuccess'
        '400':
          description: Invalid request.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Organization not found or inactive.
        '409':
          description: Slug conflict or idempotency key conflict.
        '503':
          description: Identity & Access or the Organization & Branch owner is unavailable.
  /api/v1/system/organizations/{organizationId}/branches/{branchId}:
    parameters:
      - $ref: '#/components/parameters/SystemOrganizationId'
      - $ref: '#/components/parameters/SystemBranchId'
    get:
      x-funtino-availability: implemented
      operationId: getSystemOrganizationBranch
      responses:
        '200':
          description: Authorized branch detail, including actual lifecycle status and opening hours.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemBranchSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Branch not found under this organization.
        '503':
          description: Identity & Access or the Organization & Branch owner is unavailable.
    patch:
      x-funtino-availability: implemented
      operationId: updateSystemOrganizationBranch
      description: Requires branch.update at this branch scope, fresh MFA step-up, a reason and optimistic concurrency.
      parameters:
        - $ref: '#/components/parameters/IfMatchVersion'
        - $ref: '#/components/parameters/SystemIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemBranchUpdate'
      responses:
        '200':
          description: Updated branch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemBranchSuccess'
        '400':
          description: Invalid request.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Branch not found under this organization.
        '409':
          description: Slug conflict, stale version or idempotency conflict.
        '503':
          description: Identity & Access or the Organization & Branch owner is unavailable.
  /api/v1/system/organizations/{organizationId}/branches/{branchId}/status:
    parameters:
      - $ref: '#/components/parameters/SystemOrganizationId'
      - $ref: '#/components/parameters/SystemBranchId'
    post:
      x-funtino-availability: implemented
      operationId: changeSystemOrganizationBranchStatus
      description: Supports reversible active/suspended transitions only. Suspension requires branch.deactivate; reactivation requires branch.update. Both require fresh MFA step-up and a reason.
      parameters:
        - $ref: '#/components/parameters/IfMatchVersion'
        - $ref: '#/components/parameters/SystemIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemResourceStatusChange'
      responses:
        '200':
          description: Updated actual owner-service status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemBranchSuccess'
        '400':
          description: Invalid request.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Branch not found under this organization.
        '409':
          description: Invalid lifecycle transition, stale version or idempotency conflict.
        '503':
          description: Identity & Access or the Organization & Branch owner is unavailable.
  /api/v1/customer/home:
    get:
      operationId: getCustomerHome
      parameters:
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Customer home projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerHomeSuccess'
  /api/v1/customer/profile:
    get:
      operationId: getCustomerProfile
      responses:
        '200':
          description: Current customer profile and completion state.
    patch:
      operationId: updateCustomerProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerProfileUpdate'
      responses:
        '200':
          description: Updated customer profile.
  /api/v1/customer/profile/avatar:
    get:
      operationId: getCustomerAvatar
      responses:
        '200':
          description: Private customer avatar image.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
    post:
      operationId: uploadCustomerAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Updated customer profile.
  /api/v1/customer/branches:
    get:
      operationId: listBranches
      security: []
      responses:
        '200':
          description: Active branches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerBranchesSuccess'
  /api/v1/customer/branches/{branchId}:
    get:
      operationId: getBranch
      security: []
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Active branch details.
  /api/v1/customer/households:
    get:
      operationId: listHouseholds
      responses:
        '200':
          description: Households visible to the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerHouseholdsSuccess'
    post:
      operationId: createHousehold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 80
      responses:
        '200':
          description: Household created.
  /api/v1/customer/households/{householdId}/members:
    post:
      operationId: addHouseholdMember
      parameters:
        - name: householdId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, relationship]
              properties:
                displayName:
                  type: string
                  minLength: 2
                  maxLength: 80
                relationship:
                  type: string
                  minLength: 2
                  maxLength: 40
                birthDate:
                  type: string
                  format: date
                  nullable: true
                isDependent:
                  type: boolean
      responses:
        '200':
          description: Household member created.
  /api/v1/customer/cards:
    get:
      operationId: listCards
      responses:
        '200':
          description: Cards visible to the current user's authorized households. Physical identifiers are masked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCardsSuccess'
  /api/v1/customer/cards/link:
    post:
      operationId: linkCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardLink'
      responses:
        '200':
          description: Card link requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCardSuccess'
  /api/v1/operations/permissions:
    get:
      x-funtino-availability: implemented
      operationId: listOperationsPermissions
      responses:
        '200':
          description: Full versioned permission catalog; effective authority is evaluated by the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionCatalogSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Access policy service is unavailable; access must fail closed.
  /api/v1/operations/roles:
    get:
      x-funtino-availability: implemented
      operationId: listOperationsRoles
      parameters:
        - $ref: '#/components/parameters/ScopeType'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/RoleCursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Roles visible in the requested membership scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Access policy service is unavailable; access must fail closed.
    post:
      x-funtino-availability: implemented
      operationId: createOperationsRole
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '201':
          description: Custom role created; sensitive changes require recent step-up authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleMutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Duplicate role name or stale policy version.
        '503':
          description: Tenant writes are disabled until the Organization/Branch owner validator is integrated.
  /api/v1/operations/roles/templates:
    get:
      x-funtino-availability: implemented
      operationId: listOperationsRoleTemplates
      parameters:
        - $ref: '#/components/parameters/ScopeType'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Least-privilege role templates applicable to the authorized scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleTemplatesSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Access policy service is unavailable; access must fail closed.
