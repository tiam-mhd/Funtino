        '200':
          description: Membership role changed after delegation and scope validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipMutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Membership not found in the caller's scope.
        '409':
          description: Version conflict or last-administrator invariant would be violated.
        '503':
          description: Tenant writes are disabled until the Organization/Branch owner validator is integrated.
  /api/v1/operations/staff/{membershipId}/reactivate:
    post:
      x-funtino-availability: implemented
      operationId: reactivateOperationsStaff
      parameters:
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Suspended membership reactivated after scope and policy validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipMutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Membership not found in the caller's scope.
        '409':
          description: Membership lifecycle transition is invalid.
        '503':
          description: Tenant writes are disabled until the Organization/Branch owner validator is integrated.
  /api/v1/operations/staff/{membershipId}/revoke:
    post:
      x-funtino-availability: implemented
      operationId: revokeOperationsStaffMembership
      parameters:
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Membership revoked; authorization is denied immediately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipMutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Membership not found in the caller's scope.
        '409':
          description: Lifecycle transition or last-administrator invariant violation.
        '503':
          description: Tenant writes are disabled until the Organization/Branch owner validator is integrated.
  /api/v1/operations/staff/{membershipId}/permission-overrides:
    get:
      x-funtino-availability: implemented
      operationId: listStaffPermissionOverrides
      parameters:
        - $ref: '#/components/parameters/MembershipId'
      responses:
        '200':
          description: Overrides for the target membership, visible only to an authorized manager.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionOverrideListSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      x-funtino-availability: implemented
      operationId: setStaffPermissionOverride
      parameters:
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionOverrideCreate'
      responses:
        '201':
          description: Membership-specific override created; deny takes precedence over allow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionOverrideMutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflicting policy update.
        '503':
          description: Tenant writes are disabled until the Organization/Branch owner validator is integrated.
  /api/v1/operations/staff/{membershipId}/permission-overrides/{overrideId}:
    delete:
      x-funtino-availability: implemented
      operationId: revokeStaffPermissionOverride
      parameters:
        - $ref: '#/components/parameters/MembershipId'
        - name: overrideId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Override revoked and effective on subsequent authorization checks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionOverrideMutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Override not found in the caller's scope.
        '503':
          description: Tenant writes are disabled until the Organization/Branch owner validator is integrated.
  /api/v1/operations/audit:
    get:
      x-funtino-availability: implemented
      operationId: listOperationsAccessAudit
      description: Requires a valid role and fresh server-side MFA step-up evidence (maximum age five minutes).
      parameters:
        - $ref: '#/components/parameters/ScopeType'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/AuditCursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Append-only IAM audit events visible in the authorized scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessAuditSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Access policy service is unavailable; access must fail closed.
  /api/v1/customer/wallets/{walletId}/summary:
    get:
      operationId: getWalletSummary
      parameters:
        - $ref: '#/components/parameters/WalletId'
      responses:
        '200':
          description: Wallet balances and recent ledger entries.
  /api/v1/customer/wallets/{walletId}/transactions:
    get:
      operationId: listWalletTransactions
      parameters:
        - $ref: '#/components/parameters/WalletId'
      responses:
        '200':
          description: Wallet ledger entries.
  /api/v1/customer/missions:
    get:
      operationId: listMissions
      parameters:
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Active mission catalog.
  /api/v1/customer/missions/{missionId}/claim:
    post:
      operationId: claimMission
      parameters:
        - name: missionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [householdId]
              properties:
                householdId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Idempotent mission claim.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: funtino_session
  parameters:
    SystemOrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SystemBranchId:
      name: branchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SystemCursor:
      name: cursor
      in: query
      required: false
      description: Exclusive organization or branch UUID cursor returned by the previous page.
      schema:
        type: string
        format: uuid
    SystemIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generated for one logical mutation and reused when retrying the exact same request.
      schema:
        type: string
        format: uuid
    BranchId:
      name: branchId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    ScopeType:
      name: scopeType
      in: query
      required: false
      description: Required for global scope; otherwise inferred from organizationId and branchId when omitted.
      schema:
        type: string
        enum: [global, organization, branch]
    WalletId:
      name: walletId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationId:
      name: organizationId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    DevicePageSize:
      name: pageSize
      in: query
      required: false
      description: Bounded device/branch result page; health and search filters apply only to pages already loaded by the Operations client.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    RoleCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        format: uuid
    AuditCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatchVersion:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
  schemas:
    SystemHealthStatus:
      type: string
      enum: [healthy, degraded, down, stale, unknown]
    SystemHealthSeverity:
      type: string
      enum: [critical, warning, info]
    SystemHealthService:
      type: object
      additionalProperties: false
      required:
        [
          key,
          name,
          status,
          targets,
          unavailableTargets,
          requestsPerSecond,
          serverErrorPercent,
          p95LatencyMs,
          freshnessSeconds,
          lastScrapedAt,
        ]
      properties:
        key: { type: string, pattern: '^[a-z0-9-]+$' }
        name: { type: string, minLength: 1, maxLength: 80 }
        status: { $ref: '#/components/schemas/SystemHealthStatus' }
        targets: { type: integer, minimum: 0 }
        unavailableTargets: { type: integer, minimum: 0 }
        requestsPerSecond: { type: [number, 'null'], minimum: 0 }
        serverErrorPercent: { type: [number, 'null'], minimum: 0, maximum: 100 }
        p95LatencyMs: { type: [number, 'null'], minimum: 0 }
        freshnessSeconds: { type: [integer, 'null'], minimum: 0 }
        lastScrapedAt: { type: [string, 'null'], format: date-time }
    SystemHealthAlert:
      type: object
      additionalProperties: false
      required: [name, service, severity]
      properties:
        name: { type: string, pattern: '^Funtino[A-Za-z0-9]+$' }
        service: { type: string, pattern: '^[a-z0-9-]+$' }
        severity: { $ref: '#/components/schemas/SystemHealthSeverity' }
    SystemHealthSnapshot:
      type: object
      additionalProperties: false
      required: [observedAt, source, services, activeAlerts]
      properties:
        observedAt: { type: string, format: date-time }
        source: { type: string, const: prometheus }
        services:
          type: array
          items: { $ref: '#/components/schemas/SystemHealthService' }
        activeAlerts:
          type: array
          items: { $ref: '#/components/schemas/SystemHealthAlert' }
    SystemHealthSuccess:
      type: object
      additionalProperties: false
      required: [status, data, meta]
      properties:
        status: { type: string, const: success }
        data: { $ref: '#/components/schemas/SystemHealthSnapshot' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    SystemResourceStatus:
      type: string
      enum: [active, suspended, archived]
    SystemOrganization:
      type: object
      additionalProperties: false
      required: [id, name, slug, timezone, status, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 160 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 80 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        status: { $ref: '#/components/schemas/SystemResourceStatus' }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SystemOrganizationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SystemOrganization' }
        nextCursor: { type: [string, 'null'], format: uuid }
    SystemOrganizationListSuccess:
      type: object
      additionalProperties: false
      required: [status, data, meta]
      properties:
        status: { type: string, const: success }
        data: { $ref: '#/components/schemas/SystemOrganizationPage' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    SystemOrganizationSuccess:
      type: object
      additionalProperties: false
      required: [status, data, meta]
      properties:
        status: { type: string, const: success }
        data: { $ref: '#/components/schemas/SystemOrganization' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    SystemOrganizationCreate:
      type: object
      additionalProperties: false
      required: [name, slug, timezone, reason]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 80 }
        timezone:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            description: Valid IANA timezone identifier.,
          }
        reason: { type: string, minLength: 8, maxLength: 500 }
    SystemOrganizationUpdate:
      type: object
      additionalProperties: false
      minProperties: 2
      required: [reason]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 80 }
        timezone:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            description: Valid IANA timezone identifier.,
          }
        reason: { type: string, minLength: 8, maxLength: 500 }
    SystemResourceStatusChange:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [active, suspended]
          description: Archive is intentionally excluded because it is terminal and irreversible.
        reason: { type: string, minLength: 8, maxLength: 500 }
    SystemOpeningHours:
      type: object
      additionalProperties:
        oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required: [open, close]
            properties:
              open: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
              close: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
      propertyNames:
        enum: [saturday, sunday, monday, tuesday, wednesday, thursday, friday]
    SystemBranch:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          name,
          slug,
          address,
          city,
          timezone,
          status,
          openingHours,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 160 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 80 }
        address: { type: string, minLength: 3, maxLength: 500 }
        city: { type: string, minLength: 2, maxLength: 120 }
        timezone:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            description: Valid IANA timezone identifier.,
          }
        status: { $ref: '#/components/schemas/SystemResourceStatus' }
        openingHours: { $ref: '#/components/schemas/SystemOpeningHours' }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SystemBranchPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SystemBranch' }
        nextCursor: { type: [string, 'null'], format: uuid }
    SystemBranchListSuccess:
      type: object
      additionalProperties: false
      required: [status, data, meta]
      properties:
        status: { type: string, const: success }
        data: { $ref: '#/components/schemas/SystemBranchPage' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    SystemBranchSuccess:
      type: object
      additionalProperties: false
      required: [status, data, meta]
      properties:
        status: { type: string, const: success }
        data: { $ref: '#/components/schemas/SystemBranch' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    SystemBranchCreate:
      type: object
      additionalProperties: false
      required: [name, slug, address, city, timezone, openingHours, reason]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 80 }
        address: { type: string, minLength: 3, maxLength: 500 }
        city: { type: string, minLength: 2, maxLength: 120 }
        timezone:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            description: Valid IANA timezone identifier.,
          }
        openingHours: { $ref: '#/components/schemas/SystemOpeningHours' }
        reason: { type: string, minLength: 8, maxLength: 500 }
    SystemBranchUpdate:
      type: object
      additionalProperties: false
      minProperties: 2
      required: [reason]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 80 }
        address: { type: string, minLength: 3, maxLength: 500 }
        city: { type: string, minLength: 2, maxLength: 120 }
        timezone:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            description: Valid IANA timezone identifier.,
          }
        openingHours: { $ref: '#/components/schemas/SystemOpeningHours' }
        reason: { type: string, minLength: 8, maxLength: 500 }
    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          example: '+989121234567'
    OtpVerify:
      type: object
      required: [challengeId, phone, code]
      properties:
        challengeId:
          type: string
          format: uuid
        phone:
          type: string
        code:
          type: string
          pattern: '^[0-9]{6}$'
    OtpVerifySuccess:
      type: object
      required: [status, data, meta]
      properties:
        status: { type: string, const: success }
        data:
          type: object
          required: [user, expiresAt, mfaRequired]
          properties:
            user: { type: object, description: Public profile for the authenticated identity. }
            expiresAt: { type: string, format: date-time }
            mfaRequired:
              type: boolean
              description: True for an active global system administrator; the session remains restricted until MFA is completed.
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    OtpChallengeResponse:
      type: object
      required: [challengeId, expiresAt, deliveryStatus]
      properties:
        challengeId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        deliveryStatus:
          type: string
          enum: [confirmed, unknown]
          description: 'unknown means the provider request timed out after the send attempt; the client may continue verification and must not retry automatically.'
        devCode:
          type: string
          pattern: '^[0-9]{6}$'
          description: Only returned in non-production when EXPOSE_DEV_OTP is explicitly enabled.
    TotpCode:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
    MfaProof:
      type: object
      required: [method, code]
      additionalProperties: false
      properties:
        method:
          type: string
          enum: [totp, recovery]
        code:
          type: string
          minLength: 6
          maxLength: 35
    MfaStatusSuccess:
      type: object
      required: [status, data, meta]
      properties:
        status:
          const: success
        data:
          type: object
          required: [enabled, enrollmentPending, recoveryCodesRemaining]
          properties:
            enabled:
              type: boolean
            enrollmentPending:
              type: boolean
            recoveryCodesRemaining:
              type: integer
              minimum: 0
              maximum: 10
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    MfaEnrollmentStartSuccess:
      type: object
      required: [status, data, meta]
      properties:
        status:
          const: success
        data:
          type: object
          required: [secret, otpauthUri, expiresAt]
          properties:
            secret:
              type: string
            otpauthUri:
              type: string
              pattern: '^otpauth://totp/'
            expiresAt:
              type: string
              format: date-time
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    MfaRecoveryCodesSuccess:
      type: object
      required: [status, data, meta]
      properties:
        status:
          const: success
        data:
          type: object
          required: [recoveryCodes, factorVersion, method, verifiedAt, validUntil]
          properties:
            recoveryCodes:
              type: array
              minItems: 10
              maxItems: 10
              items:
                type: string
            factorVersion:
              type: integer
              minimum: 1
            method:
              type: string
              enum: [totp, recovery]
            verifiedAt:
              type: string
              format: date-time
            validUntil:
              type: string
              format: date-time
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    MfaStepUpSuccess:
      type: object
      required: [status, data, meta]
      properties:
        status:
          const: success
        data:
          type: object
          required: [method, factorVersion, verifiedAt, validUntil]
          properties:
            method:
              type: string
              enum: [totp, recovery]
            factorVersion:
              type: integer
              minimum: 1
            verifiedAt:
              type: string
              format: date-time
            validUntil:
              type: string
              format: date-time
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    CardLink:
      type: object
      required: [householdId, branchId, externalCardId]
      properties:
        householdId:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
          nullable: true
        branchId:
          type: string
          format: uuid
          description: Branch printed/encoded on the physical card. Linking the card creates the customer-branch relationship.
        externalCardId:
          type: string
    CustomerCardSummary:
      type: object
      required:
        [
          id,
          householdId,
          memberId,
          branchId,
          maskedCardId,
          status,
          lastSyncedAt,
          walletId,
          isStale,
          freshness,
        ]
      properties:
        id:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
          description: Household authorized for the current customer session; this is a shared household-level card, not a member-specific card.
        memberId:
          type: string
          format: uuid
          nullable: true
          description: Always null for family-shared branch cards; retained only for DTO compatibility.
        branchId:
          type: string
          format: uuid
          nullable: true
        maskedCardId:
          type: string
          description: Fixed mask plus the final four characters; the physical identifier is never returned.
          example: '•••• •••• 4821'
        status:
          type: string
          enum: [pending_sync, active, blocked, unlinked]
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
        walletId:
          type: string
          format: uuid
          nullable: true
        isStale:
          type: boolean
        freshness:
          type: string
          enum: [fresh, stale, unknown]
    CustomerHouseholdMemberSummary:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
