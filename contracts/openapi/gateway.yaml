          application/json:
            schema:
              $ref: '#/components/schemas/PermissionOverrideCreate'
      responses:
        '201':
          description: Membership-specific override created; deny takes precedence over allow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionOverrideMutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflicting policy update.
        '503':
          description: Tenant writes are disabled until the Organization/Branch owner validator is integrated.
  /api/v1/operations/staff/{membershipId}/permission-overrides/{overrideId}:
    security:
      - managementSessionCookie: []
    delete:
      x-funtino-availability: implemented
      operationId: revokeStaffPermissionOverride
      description: Revokes a permission override immediately. Requires access.permission.delegate, fresh MFA step-up, and a reason.
      parameters:
        - $ref: '#/components/parameters/MembershipId'
        - name: overrideId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Override revoked and effective on subsequent authorization checks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionOverrideMutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Override not found in the caller's scope.
        '503':
          description: Tenant writes are disabled until the Organization/Branch owner validator is integrated.
  /api/v1/operations/audit:
    security:
      - managementSessionCookie: []
    get:
      x-funtino-availability: implemented
      operationId: listOperationsAccessAudit
      description: Reads authorized audit history with the required role and scope. Reading audit data does not require MFA step-up.
      parameters:
        - $ref: '#/components/parameters/ScopeType'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/AuditCursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Append-only IAM audit events visible in the authorized scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessAuditSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Access policy service is unavailable; access must fail closed.
  /api/v1/customer/wallets/{walletId}/summary:
    get:
      operationId: getWalletSummary
      parameters:
        - $ref: '#/components/parameters/WalletId'
      responses:
        '200':
          description: Wallet balances and recent ledger entries.
  /api/v1/customer/wallets/{walletId}/transactions:
    get:
      operationId: listWalletTransactions
      parameters:
        - $ref: '#/components/parameters/WalletId'
      responses:
        '200':
          description: Wallet ledger entries.
  /api/v1/customer/missions:
    get:
      operationId: listMissions
      parameters:
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Active mission catalog.
  /api/v1/customer/missions/{missionId}/claim:
    post:
      operationId: claimMission
      parameters:
        - name: missionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [householdId]
              properties:
                householdId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Idempotent mission claim.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: funtino_session
      description: Customer audience session cookie. It cannot authorize operations or system endpoints.
    managementSessionCookie:
      type: apiKey
      in: cookie
      name: funtino_management_session
      description: Management audience session cookie shared by Operations and System applications.
  parameters:
    SystemOrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SystemBranchId:
      name: branchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SystemCursor:
      name: cursor
      in: query
      required: false
      description: Exclusive organization or branch UUID cursor returned by the previous page.
      schema:
        type: string
        format: uuid
    SystemIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generated for one logical mutation and reused when retrying the exact same request.
      schema:
        type: string
        format: uuid
    BranchId:
      name: branchId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    ScopeType:
      name: scopeType
      in: query
      required: false
      description: Required for global scope; otherwise inferred from organizationId and branchId when omitted.
      schema:
        type: string
        enum: [global, organization, branch]
    WalletId:
      name: walletId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationId:
      name: organizationId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CustomerFamilyInvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    DevicePageSize:
      name: pageSize
      in: query
      required: false
      description: Bounded device/branch result page; health and search filters apply only to pages already loaded by the Operations client.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    RoleCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        format: uuid
    AuditCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatchVersion:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
  schemas:
    CustomerFamilyRelationship:
      type: object
      additionalProperties: false
      required: [fromMemberId, toMemberId, kind, basis]
      properties:
        id: { type: string, format: uuid }
        fromMemberId: { type: string, format: uuid }
        toMemberId: { type: string, format: uuid }
        kind: { type: string, enum: [parent_of, spouse_of, sibling_of, guardian_of] }
        basis: { type: string, enum: [biological, legal, adoptive, step, partner, unspecified] }
    CustomerFamilyInvitation:
      type: object
      additionalProperties: false
      required: [id, householdId, memberId, kind, status, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        kind: { type: string, enum: [adult_account, dependent_claim] }
        status:
          {
            type: string,
            enum:
              [
                pending,
                accepted,
                declined,
                revoked,
                expired,
                claim_pending,
                linked,
                conflict_review,
              ],
          }
        expiresAt:
          {
            type: [string, 'null'],
            format: date-time,
            description: Always null in household lists to prevent account-state inference.,
          }
        createdAt: { type: string, format: date-time }
        householdName: { type: string, minLength: 2, maxLength: 80 }
        memberName: { type: string, minLength: 2, maxLength: 80 }
    CustomerFamilyMember:
      type: object
      additionalProperties: false
      required:
        [
          id,
          householdId,
          displayName,
          relationship,
          relationshipLabel,
          relationshipStatus,
          displayGender,
          isAccountLinked,
          isViewer,
          birthDate,
          status,
          isDependent,
          version,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        displayName: { type: string, minLength: 2, maxLength: 80 }
        relationship:
          {
            type: string,
            minLength: 2,
            maxLength: 40,
            description: Legacy user-entered text; never used to infer graph facts.,
          }
        relationshipLabel: { type: string, minLength: 1, maxLength: 80 }
        relationshipStatus: { type: string, enum: [verified, ambiguous, needs_review] }
        displayGender: { type: [string, 'null'], enum: [female, male, unspecified, null] }
        isAccountLinked: { type: boolean }
        isViewer: { type: boolean }
        birthDate: { type: [string, 'null'], format: date }
        status: { type: string, enum: [active, pending, archived] }
        isDependent: { type: boolean }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
    CustomerFamilyHousehold:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          status,
          version,
          createdAt,
          accessRole,
          canManage,
          viewerMemberId,
          members,
          relationships,
          invitations,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 80 }
        status: { type: string, enum: [active, suspended, archived] }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        accessRole: { type: string, enum: [owner, guardian, member] }
        canManage: { type: boolean }
        viewerMemberId: { type: [string, 'null'], format: uuid }
        members: { type: array, items: { $ref: '#/components/schemas/CustomerFamilyMember' } }
        relationships:
          { type: array, items: { $ref: '#/components/schemas/CustomerFamilyRelationship' } }
        invitations:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CustomerFamilyInvitation'
              - type: object
                required: [memberName]
                properties:
                  memberName: { type: string, minLength: 2, maxLength: 80 }
    CustomerFamilyData:
      type: object
      additionalProperties: false
      required: [items, invitations]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CustomerFamilyHousehold' } }
        invitations:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CustomerFamilyInvitation'
              - type: object
                required: [householdName, memberName]
                properties:
                  householdName: { type: string, minLength: 2, maxLength: 80 }
                  memberName: { type: string, minLength: 2, maxLength: 80 }
    CustomerFamilySuccess:
      type: object
      required: [status, data, meta]
      properties:
        status: { type: string, const: success }
        data: { $ref: '#/components/schemas/CustomerFamilyData' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    CustomerFamilyMemberCreateRequest:
      type: object
      additionalProperties: false
      required: [displayName, relationship, basis, isDependent]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 80 }
        relativeMemberId:
          description: Adult account invitations must use viewer so the relationship is anchored to the inviter; relationships with another linked adult require that adult's consent.
          oneOf:
            - { type: string, enum: [viewer] }
            - { type: string, format: uuid }
            - { type: 'null' }
        relationship: { type: string, enum: [parent, child, spouse, sibling, guardian, ward] }
        basis: { type: string, enum: [biological, legal, adoptive, step, partner, unspecified] }
        displayGender: { type: string, enum: [female, male, unspecified] }
        birthDate: { type: [string, 'null'], format: date }
        isDependent: { type: boolean }
        phone:
          {
            type: string,
            minLength: 8,
            maxLength: 20,
            writeOnly: true,
            description: Normalized only in Gateway; never forwarded to Customer & Household.,
          }
        createClaimLink: { type: boolean }
    CustomerFamilyMemberUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        displayName: { type: string, minLength: 2, maxLength: 80 }
        displayGender: { type: [string, 'null'], enum: [female, male, unspecified, null] }
        birthDate: { type: [string, 'null'], format: date }
        relationshipId: { type: string, format: uuid }
        relativeMemberId: { type: string, format: uuid }
        relationship: { type: string, enum: [parent, child, spouse, sibling, guardian, ward] }
        basis: { type: string, enum: [biological, legal, adoptive, step, partner, unspecified] }
      anyOf:
        - required: [displayName]
        - required: [displayGender]
        - required: [birthDate]
        - required: [relativeMemberId, relationship, basis]
    CustomerFamilyMemberCreated:
      type: object
      additionalProperties: false
      required:
        [
          id,
          householdId,
          displayName,
          relationship,
          birthDate,
          status,
          isDependent,
          version,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        displayName: { type: string, minLength: 2, maxLength: 80 }
        relationship: { type: string, minLength: 2, maxLength: 40 }
        birthDate: { type: [string, 'null'], format: date }
        status: { type: string, enum: [active, pending, archived] }
        isDependent: { type: boolean }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
    CustomerFamilyMemberCreateSuccess:
      type: object
      required: [status, data, meta]
      properties:
        status: { type: string, const: success }
        data:
          type: object
          additionalProperties: false
          required: [member, relationship, invitation]
          properties:
            member: { $ref: '#/components/schemas/CustomerFamilyMemberCreated' }
            relationship:
              oneOf:
                - { $ref: '#/components/schemas/CustomerFamilyRelationship' }
                - { type: 'null' }
            invitation:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [id, householdId, memberId, kind, status, expiresAt, createdAt]
                  properties:
                    id: { type: string, format: uuid }
                    householdId: { type: string, format: uuid }
                    memberId: { type: string, format: uuid }
                    kind: { type: string, enum: [adult_account, dependent_claim] }
                    status: { type: string, const: pending }
                    expiresAt: { type: [string, 'null'], format: date-time }
                    createdAt: { type: string, format: date-time }
                    shareToken:
                      {
                        type: string,
                        minLength: 40,
                        maxLength: 128,
                        description: Returned only on the first successful create response; idempotent replays omit it. The token is random,
                        and only its hash is persisted.,
                      }
                - { type: 'null' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    CustomerFamilyMemberUpdateSuccess:
      type: object
      required: [status, data, meta]
      properties:
        status: { type: string, const: success }
        data: { $ref: '#/components/schemas/CustomerFamilyMemberCreated' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    CustomerFamilyRelationshipRemoveSuccess:
      type: object
      required: [status, data, meta]
      properties:
        status: { type: string, const: success }
        data:
          type: object
          additionalProperties: false
          required: [relationshipId, householdId, memberId, version]
          properties:
            relationshipId: { type: string, format: uuid }
            householdId: { type: string, format: uuid }
            memberId: { type: string, format: uuid }
            version: { type: integer, minimum: 1 }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    CustomerFamilyInvitationPreviewSuccess:
      type: object
      required: [status, data, meta]
      properties:
        status: { type: string, const: success }
        data:
          oneOf:
            - type: object
              additionalProperties: false
              required: [valid]
              properties: { valid: { type: boolean, const: false } }
            - type: object
              additionalProperties: false
              required: [valid, invitationId, householdName, memberName, kind, expiresAt]
              properties:
                valid: { type: boolean, const: true }
                invitationId: { type: string, format: uuid }
                householdName: { type: string, minLength: 2, maxLength: 80 }
                memberName: { type: string, minLength: 2, maxLength: 80 }
                kind: { type: string, enum: [adult_account, dependent_claim] }
                expiresAt: { type: [string, 'null'], format: date-time }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    CustomerFamilyInvitationAcceptRequest:
      type: object
      additionalProperties: false
      properties:
        token: { type: string, minLength: 40, maxLength: 128, writeOnly: true }
        invitationId: { type: string, format: uuid }
      oneOf:
        - required: [token]
        - required: [invitationId]
    CustomerFamilyInvitationSuccess:
      type: object
      required: [status, data, meta]
      properties:
        status: { type: string, const: success }
        data: { $ref: '#/components/schemas/CustomerFamilyInvitation' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    CustomerFamilySupportLookupRequest:
      type: object
      additionalProperties: false
      required: [organizationId, branchId, phone]
      properties:
        organizationId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        phone: { type: string, minLength: 8, maxLength: 20, writeOnly: true }
    CustomerFamilySupportLookupSuccess:
      type: object
      required: [status, data, meta]
      properties:
        status: { type: string, const: success }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [householdId, householdName, members, relationships, invitations, history]
                properties:
                  householdId: { type: string, format: uuid }
                  householdName: { type: string, minLength: 2, maxLength: 80 }
                  members:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        [
                          id,
                          displayName,
                          relationshipLabel,
                          relationshipStatus,
                          legacyRelationship,
                          isAccountLinked,
                          isDependent,
                          status,
                        ]
                      properties:
                        id: { type: string, format: uuid }
                        displayName: { type: string, minLength: 2, maxLength: 80 }
                        relationshipLabel: { type: string, minLength: 1, maxLength: 80 }
                        relationshipStatus:
                          { type: string, enum: [verified, ambiguous, needs_review] }
                        legacyRelationship: { type: [string, 'null'], maxLength: 40 }
                        isAccountLinked: { type: boolean }
                        isDependent: { type: boolean }
                        status: { type: string, enum: [active, pending, archived] }
                  relationships:
                    {
                      type: array,
                      items: { $ref: '#/components/schemas/CustomerFamilyRelationship' },
                    }
                  invitations:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [memberName, status]
                      properties:
                        memberName: { type: string, minLength: 2, maxLength: 80 }
                        status:
                          {
                            type: string,
                            enum:
                              [
                                pending,
                                accepted,
                                declined,
                                revoked,
                                expired,
                                claim_pending,
                                linked,
                                conflict_review,
                              ],
                          }
                  history:
                    type: array
                    maxItems: 25
                    items:
                      type: object
                      additionalProperties: false
                      required: [action, createdAt]
                      properties:
                        action: { type: string, minLength: 1, maxLength: 120 }
                        createdAt: { type: string, format: date-time }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    SystemHealthStatus:
      type: string
      enum: [healthy, degraded, down, stale, unknown]
    SystemHealthSeverity:
      type: string
      enum: [critical, warning, info]
    SystemHealthService:
      type: object
      additionalProperties: false
      required:
        [
          key,
          name,
          status,
          targets,
          unavailableTargets,
          requestsPerSecond,
          serverErrorPercent,
          p95LatencyMs,
          freshnessSeconds,
          lastScrapedAt,
        ]
      properties:
        key: { type: string, pattern: '^[a-z0-9-]+$' }
        name: { type: string, minLength: 1, maxLength: 80 }
        status: { $ref: '#/components/schemas/SystemHealthStatus' }
        targets: { type: integer, minimum: 0 }
        unavailableTargets: { type: integer, minimum: 0 }
        requestsPerSecond: { type: [number, 'null'], minimum: 0 }
        serverErrorPercent: { type: [number, 'null'], minimum: 0, maximum: 100 }
        p95LatencyMs: { type: [number, 'null'], minimum: 0 }
        freshnessSeconds: { type: [integer, 'null'], minimum: 0 }
        lastScrapedAt: { type: [string, 'null'], format: date-time }
    SystemHealthAlert:
      type: object
      additionalProperties: false
      required: [name, service, severity]
      properties:
        name: { type: string, pattern: '^Funtino[A-Za-z0-9]+$' }
        service: { type: string, pattern: '^[a-z0-9-]+$' }
        severity: { $ref: '#/components/schemas/SystemHealthSeverity' }
    SystemHealthSnapshot:
      type: object
      additionalProperties: false
      required: [observedAt, source, services, activeAlerts]
      properties:
        observedAt: { type: string, format: date-time }
        source: { type: string, const: prometheus }
        services:
          type: array
          items: { $ref: '#/components/schemas/SystemHealthService' }
        activeAlerts:
          type: array
          items: { $ref: '#/components/schemas/SystemHealthAlert' }
    SystemHealthSuccess:
      type: object
      additionalProperties: false
      required: [status, data, meta]
      properties:
        status: { type: string, const: success }
        data: { $ref: '#/components/schemas/SystemHealthSnapshot' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    SystemManagementSessionPolicy:
      type: object
      additionalProperties: false
      required: [managementSessionTtlHours, policyVersion]
      properties:
        managementSessionTtlHours: { type: integer, minimum: 1, maximum: 12 }
        policyVersion: { type: integer, minimum: 1 }
    SystemManagementSessionPolicySuccess:
      type: object
      additionalProperties: false
      required: [status, data, meta]
      properties:
        status: { type: string, const: success }
        data: { $ref: '#/components/schemas/SystemManagementSessionPolicy' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    SystemManagementSessionPolicyUpdate:
      type: object
      additionalProperties: false
      required: [managementSessionTtlHours]
      properties:
        managementSessionTtlHours: { type: integer, minimum: 1, maximum: 12 }
        reason: { type: string, maxLength: 500 }
    SystemResourceStatus:
      type: string
      enum: [active, suspended, archived]
    SystemOrganization:
      type: object
      additionalProperties: false
      required: [id, name, slug, timezone, status, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 160 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 80 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        status: { $ref: '#/components/schemas/SystemResourceStatus' }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SystemOrganizationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SystemOrganization' }
        nextCursor: { type: [string, 'null'], format: uuid }
    SystemOrganizationListSuccess:
      type: object
      additionalProperties: false
      required: [status, data, meta]
      properties:
        status: { type: string, const: success }
        data: { $ref: '#/components/schemas/SystemOrganizationPage' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    SystemOrganizationSuccess:
      type: object
      additionalProperties: false
      required: [status, data, meta]
      properties:
        status: { type: string, const: success }
        data: { $ref: '#/components/schemas/SystemOrganization' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
