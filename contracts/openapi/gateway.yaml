        challengeId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        deliveryStatus:
          type: string
          enum: [confirmed, unknown]
          description: 'unknown means the provider request timed out after the send attempt; the client may continue verification and must not retry automatically.'
        devCode:
          type: string
          pattern: '^[0-9]{6}$'
          description: Only returned in non-production when EXPOSE_DEV_OTP is explicitly enabled.
