            days: { type: integer, minimum: 1, maximum: 366 }
        snapshot:
          type: object
          additionalProperties: false
          required: [organizations, branches, devices, branchBreakdown, branchBreakdownTruncated]
          properties:
            organizations: { $ref: '#/components/schemas/OperationsReportResourceCounts' }
            branches: { $ref: '#/components/schemas/OperationsReportResourceCounts' }
            devices:
              type: object
              additionalProperties: false
              required: [total, active, suspended, retired, unknownLifecycle, health]
              properties:
                total: { type: integer, minimum: 0 }
                active: { type: integer, minimum: 0 }
                suspended: { type: integer, minimum: 0 }
                retired: { type: integer, minimum: 0 }
                unknownLifecycle: { type: integer, minimum: 0 }
                health: { $ref: '#/components/schemas/OperationsReportHealthCounts' }
            branchBreakdown:
              type: array
              maxItems: 500
              items: { $ref: '#/components/schemas/OperationsReportBranchRow' }
            branchBreakdownTruncated: { type: boolean }
        daily:
          type: array
          minItems: 1
          maxItems: 366
          items: { $ref: '#/components/schemas/OperationsReportDailyRow' }
        totals:
          type: object
          additionalProperties: false
          required:
            [
              branchesCreated,
              branchStatusChanges,
              devicesRegistered,
              deviceUpdates,
              healthOnline,
              healthDegraded,
              healthOffline,
            ]
          properties:
            branchesCreated: { type: integer, minimum: 0 }
            branchStatusChanges: { type: integer, minimum: 0 }
            devicesRegistered: { type: integer, minimum: 0 }
            deviceUpdates: { type: integer, minimum: 0 }
            healthOnline: { type: integer, minimum: 0 }
            healthDegraded: { type: integer, minimum: 0 }
            healthOffline: { type: integer, minimum: 0 }
        projection:
          type: object
          additionalProperties: false
          required: [generationId, coverageStartedAt, lastEventAt, lastProcessedAt, asOf]
          properties:
            generationId: { type: string, format: uuid }
            coverageStartedAt: { type: [string, 'null'], format: date-time }
            lastEventAt: { type: [string, 'null'], format: date-time }
            lastProcessedAt: { type: [string, 'null'], format: date-time }
            asOf: { type: string, format: date-time }
        capabilities:
          type: object
          additionalProperties: false
          required: [canExport]
          properties:
            canExport:
              type: boolean
              description: True only when IAM grants report.export or MFA step-up is the sole remaining requirement; the export request is always reauthorized server-side.
