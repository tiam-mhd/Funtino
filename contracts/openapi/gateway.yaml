          minLength: 8
          maxLength: 500
    StaffMembershipSuccess:
      type: object
      required: [status, data, meta]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [data, policyVersion]
          properties:
            data:
              $ref: '#/components/schemas/StaffSummary'
            policyVersion:
              type: integer
              minimum: 1
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    MembershipMutationSuccess:
      type: object
      required: [status, data, meta]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [data, policyVersion]
          properties:
            data:
              $ref: '#/components/schemas/StaffSummary'
            policyVersion:
              type: integer
              minimum: 1
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    OperationsAccessContextSuccess:
      type: object
      required: [status, data, meta]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [memberships, policyVersion, catalogVersion]
          properties:
            memberships:
              type: array
              items:
                $ref: '#/components/schemas/AccessMembershipSummary'
            policyVersion:
              type: integer
              minimum: 1
            catalogVersion:
              type: integer
              minimum: 1
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    OperationsTenantScope:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, organizationId]
