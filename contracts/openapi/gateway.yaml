openapi: 3.1.0
info:
  title: Funtino API Gateway
  version: 0.1.0
  description: >-
    Public REST contract for customer, operations and system web apps. Operations marked
    x-funtino-availability: implemented are live; planned operations are not callable yet.
servers:
  - url: http://localhost:4000
security:
  - sessionCookie: []
paths:
  /health/live:
    get:
      operationId: healthLive
      security: []
      responses:
        '200':
          description: Service is alive.
  /health/ready:
    get:
      operationId: healthReady
      security: []
      responses:
        '200':
          description: Service readiness.
  /api/v1/auth/otp/request:
    post:
      operationId: requestOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '200':
          description: OTP challenge created.
          content:
            application/json:
              schema:
                type: object
                required: [status, data, meta]
                properties:
                  status:
                    type: string
                    enum: [success]
                  data:
                    $ref: '#/components/schemas/OtpChallengeResponse'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
      responses:
        '200':
          description: Creates or resumes the customer identity and sets only the customer session cookie. Staff memberships do not change this audience or grant customer sessions access to management routes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpVerifySuccess' }
        '503':
          description: IAM could not classify the authenticated identity; no session is issued.
  /api/v1/auth/management/otp/request:
    post:
      operationId: requestManagementOtp
      security: []
      description: Requests an OTP specifically for the management audience. The identity must already have an eligible active staff membership; customer sign-in never creates or selects one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '200':
          description: Management OTP challenge created with purpose bound to management login.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpChallengeResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/management/otp/verify:
    post:
      operationId: verifyManagementOtp
      security: []
      description: Verifies a management-purpose OTP. Sets only the management session cookie when no management password is configured; otherwise sets a short-lived, path-restricted password challenge cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerify' }
      responses:
        '200':
          description: Management session created or password challenge issued; the response reports requiresPassword and expiresAt.
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/management/password/verify:
    post:
      operationId: verifyManagementPassword
      security: []
      description: Completes a one-use password challenge from the management OTP flow and sets the management session cookie. A successful response clears the customer and challenge cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              additionalProperties: false
              properties:
                password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
      responses:
        '200': { description: Management session created; the management cookie is set. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/management/me:
    security:
      - managementSessionCookie: []
    get:
      operationId: getManagementMe
      description: Returns the current management identity using the management audience cookie.
      responses:
        '200': { description: Current management user profile. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/auth/management/password:
    security:
      - managementSessionCookie: []
    get:
      operationId: getManagementPasswordStatus
      description: Returns whether a management password is enabled; password material is never returned.
      responses:
        '200': { description: Management password status. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    put:
      operationId: updateManagementPassword
      description: Enables, changes, or disables the optional management password after a management-purpose OTP challenge. Disabling or changing an existing password also requires the current password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, challengeId, code]
              additionalProperties: false
              properties:
                enabled: { type: boolean }
                challengeId: { type: string, format: uuid }
                code: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
                password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
                currentPassword: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
      responses:
        '200': { description: Password setting updated. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/management/password/otp/request:
    security:
      - managementSessionCookie: []
    post:
      operationId: requestManagementPasswordOtp
      description: Requests a one-time confirmation code for changing the optional management password.
      responses:
        '200': { description: Password update OTP challenge created. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/management/logout:
    security:
      - managementSessionCookie: []
    post:
      operationId: managementLogout
      description: Revokes the management session and clears the management and password challenge cookies.
      responses:
        '200': { description: Management session revoked. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/auth/me:
    get:
      operationId: getMe
      description: Returns the current customer identity using the customer audience cookie.
      responses:
        '200':
          description: Current user.
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        '200':
          description: Session revoked and cookie cleared.
  /api/v1/operations/mfa/status:
    security:
      - managementSessionCookie: []
    get:
      x-funtino-availability: implemented
      operationId: getCurrentStaffMfaStatus
      responses:
        '200':
          description: MFA status for the authenticated staff account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStatusSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/operations/mfa/enrollment/start:
    security:
      - managementSessionCookie: []
    post:
      x-funtino-availability: implemented
      operationId: startCurrentStaffMfaEnrollment
      responses:
        '200':
          description: A pending TOTP secret and URI. The response is no-store and must never be logged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollmentStartSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: MFA is already enabled.
  /api/v1/operations/mfa/enrollment/confirm:
    security:
      - managementSessionCookie: []
    post:
      x-funtino-availability: implemented
      operationId: confirmCurrentStaffMfaEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCode'
      responses:
        '200':
          description: MFA enabled; ten single-use recovery codes are shown exactly once. Response is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaRecoveryCodesSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: MFA verification is temporarily locked.
  /api/v1/operations/mfa/step-up/verify:
    security:
      - managementSessionCookie: []
    post:
      x-funtino-availability: implemented
      operationId: verifyCurrentStaffMfaStepUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaProof'
      responses:
        '200':
          description: Fresh MFA evidence attached to this server-side session for at most five minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStepUpSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: MFA verification is temporarily locked.
  /api/v1/operations/mfa/recovery-codes/regenerate:
    security:
      - managementSessionCookie: []
    post:
      x-funtino-availability: implemented
      operationId: regenerateCurrentStaffMfaRecoveryCodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaProof'
      responses:
        '200':
          description: Previous unused codes are revoked; ten new codes are shown once. Response is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaRecoveryCodesSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: MFA verification is temporarily locked.
  /api/v1/operations/mfa/disable:
    security:
      - managementSessionCookie: []
    post:
      x-funtino-availability: implemented
      operationId: disableCurrentStaffMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaProof'
      responses:
        '200':
          description: MFA disabled after current-factor verification; all session step-up evidence is invalidated.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: MFA verification is temporarily locked.
  /api/v1/operations/access-context:
    security:
      - managementSessionCookie: []
    get:
      x-funtino-availability: implemented
      operationId: getOperationsAccessContext
      responses:
        '200':
          description: Non-revoked staff memberships and policy version available to the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsAccessContextSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Access policy service is unavailable; access must fail closed.
  /api/v1/operations/scopes:
    security:
      - managementSessionCookie: []
    get:
      x-funtino-availability: implemented
      operationId: listCurrentOperationsScopes
      description: Returns the user's active organization memberships and their active child branches, plus directly assigned active branch memberships, after confirming the organization/branch owner records. An organization membership makes its active child branches selectable; each operation still checks the exact permission and scope. Response is private and never cached.
      responses:
        '200':
          description: Current active scopes available to the authenticated operations user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsScopesSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          description: IAM or Organization & Branch could not confirm current scope state; access fails closed.
  /api/v1/operations/scope-selection:
    security:
      - managementSessionCookie: []
    post:
      x-funtino-availability: implemented
      operationId: selectCurrentOperationsScope
      description: Revalidates that the requested tenant scope is covered by an active IAM membership (including a child branch covered by an organization membership) and is backed by an active organization and, for branch scopes, an active branch with the requested parent. Successful user selections are audited. Every subsequent data request must still be independently authorized for its exact scope and permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationsScopeSelectionRequest'
      responses:
        '200':
          description: Scope revalidated and selection audit recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsScopeSelectionSuccess'
        '400':
          description: Invalid organization or branch scope format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: IAM, owner data, or audit storage is unavailable; selection is not accepted.
  /api/v1/system/health:
    security:
      - managementSessionCookie: []
    get:
      x-funtino-availability: implemented
      operationId: readSystemOperationalHealth
      description: Requires an active session and the global system.health.read permission. Returns a restricted summary from the private Prometheus query API; internal target addresses and arbitrary query execution are never exposed.
      responses:
        '200':
          description: Current backend availability, aggregate HTTP telemetry, freshness and active operational alerts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Private telemetry source is not configured or is temporarily unavailable.
  /api/v1/system/security/session-policy:
    security:
      - managementSessionCookie: []
    get:
      x-funtino-availability: implemented
      operationId: readManagementSessionPolicy
      description: Requires an active session and global system.session_policy.manage permission. Returns the IAM-owned absolute lifetime used for subsequent management logins.
      responses:
        '200':
          description: Current management session lifetime and policy version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemManagementSessionPolicySuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Identity & Access policy data is unavailable.
    put:
      x-funtino-availability: implemented
      operationId: updateManagementSessionPolicy
      description: Requires an active session, global system.session_policy.manage permission, a trusted browser origin, an idempotency key, and the current policy version. MFA step-up and a reason are required only when the TTL value actually changes; a no-op update does not require either.
      parameters:
        - $ref: '#/components/parameters/SystemIdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemManagementSessionPolicyUpdate'
      responses:
        '200':
          description: The future management session lifetime was saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemManagementSessionPolicySuccess'
        '400':
          description: Duration, reason, or command metadata is invalid.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Policy version is stale; reload settings before retrying.
        '503':
          description: IAM management writes are disabled or the IAM policy store is unavailable.
  /api/v1/system/organizations:
    security:
      - managementSessionCookie: []
    get:
      x-funtino-availability: implemented
      operationId: listSystemOrganizations
      description: Returns only global-readable organizations or organization IDs authorized individually by Identity & Access. The service-owner data is never queried directly from this app.
      parameters:
        - $ref: '#/components/parameters/SystemCursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A keyset-paginated page of authorized organizations with their actual owner-service status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemOrganizationListSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Identity & Access or the Organization & Branch owner is unavailable; access fails closed.
    post:
      x-funtino-availability: implemented
      operationId: createSystemOrganization
      description: Requires organization.create at global scope, fresh MFA step-up and trusted browser origin. A reason is optional and is recorded when supplied.
      parameters:
        - $ref: '#/components/parameters/SystemIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemOrganizationCreate'
      responses:
        '201':
          description: Organization created by the owner service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemOrganizationSuccess'
        '400':
          description: Invalid request.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Slug conflict or idempotency key conflict.
        '503':
          description: Identity & Access or the Organization & Branch owner is unavailable.
  /api/v1/system/organizations/{organizationId}:
    security:
      - managementSessionCookie: []
    parameters:
      - $ref: '#/components/parameters/SystemOrganizationId'
    get:
      x-funtino-availability: implemented
      operationId: getSystemOrganization
      responses:
        '200':
          description: Authorized organization detail, including its actual lifecycle status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemOrganizationSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Organization not found.
        '503':
          description: Identity & Access or the Organization & Branch owner is unavailable.
    patch:
      x-funtino-availability: implemented
      operationId: updateSystemOrganization
      description: Requires organization.update at this organization scope and optimistic concurrency. This ordinary organization edit does not require MFA step-up; a reason is optional.
      parameters:
        - $ref: '#/components/parameters/IfMatchVersion'
        - $ref: '#/components/parameters/SystemIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemOrganizationUpdate'
      responses:
        '200':
          description: Updated organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemOrganizationSuccess'
        '400':
          description: Invalid request.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Organization not found.
        '409':
          description: Slug conflict, stale version or idempotency conflict.
        '503':
          description: Identity & Access or the Organization & Branch owner is unavailable.
  /api/v1/system/organizations/{organizationId}/status:
    security:
      - managementSessionCookie: []
    parameters:
      - $ref: '#/components/parameters/SystemOrganizationId'
    post:
      x-funtino-availability: implemented
      operationId: changeSystemOrganizationStatus
      description: This management surface supports reversible active/suspended transitions only. Archiving is terminal and is not offered here. Requires organization.update; no MFA step-up or reason is required for these reversible transitions.
      parameters:
        - $ref: '#/components/parameters/IfMatchVersion'
        - $ref: '#/components/parameters/SystemIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemResourceStatusChange'
      responses:
        '200':
          description: Updated actual owner-service status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemOrganizationSuccess'
        '400':
          description: Invalid request.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Organization not found.
        '409':
          description: Invalid lifecycle transition, stale version or idempotency conflict.
        '503':
          description: Identity & Access or the Organization & Branch owner is unavailable.
  /api/v1/system/organizations/{organizationId}/branches:
    security:
      - managementSessionCookie: []
    parameters:
      - $ref: '#/components/parameters/SystemOrganizationId'
    get:
      x-funtino-availability: implemented
      operationId: listSystemOrganizationBranches
      description: Requires branch.read for the requested organization scope; owner service enforces the parent relationship.
      parameters:
        - $ref: '#/components/parameters/SystemCursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A paginated page of branches with actual lifecycle status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemBranchListSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Organization not found.
        '503':
          description: Identity & Access or the Organization & Branch owner is unavailable.
    post:
      x-funtino-availability: implemented
      operationId: createSystemOrganizationBranch
      description: Requires branch.create at the organization scope and a trusted browser origin. Ordinary branch creation does not require MFA step-up; a reason is optional.
      parameters:
        - $ref: '#/components/parameters/SystemIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemBranchCreate'
      responses:
        '201':
          description: Branch created by the owner service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemBranchSuccess'
        '400':
          description: Invalid request.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Organization not found or inactive.
        '409':
          description: Slug conflict or idempotency key conflict.
        '503':
          description: Identity & Access or the Organization & Branch owner is unavailable.
  /api/v1/system/organizations/{organizationId}/branches/{branchId}:
    security:
      - managementSessionCookie: []
    parameters:
      - $ref: '#/components/parameters/SystemOrganizationId'
      - $ref: '#/components/parameters/SystemBranchId'
    get:
      x-funtino-availability: implemented
      operationId: getSystemOrganizationBranch
      responses:
        '200':
          description: Authorized branch detail, including actual lifecycle status and opening hours.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemBranchSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Branch not found under this organization.
        '503':
          description: Identity & Access or the Organization & Branch owner is unavailable.
    patch:
      x-funtino-availability: implemented
      operationId: updateSystemOrganizationBranch
      description: Requires branch.update at this branch scope and optimistic concurrency. Ordinary branch edits do not require MFA step-up; a reason is optional.
      parameters:
        - $ref: '#/components/parameters/IfMatchVersion'
        - $ref: '#/components/parameters/SystemIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemBranchUpdate'
      responses:
        '200':
          description: Updated branch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemBranchSuccess'
        '400':
          description: Invalid request.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Branch not found under this organization.
        '409':
          description: Slug conflict, stale version or idempotency conflict.
        '503':
          description: Identity & Access or the Organization & Branch owner is unavailable.
  /api/v1/system/organizations/{organizationId}/branches/{branchId}/status:
    security:
      - managementSessionCookie: []
    parameters:
      - $ref: '#/components/parameters/SystemOrganizationId'
      - $ref: '#/components/parameters/SystemBranchId'
    post:
      x-funtino-availability: implemented
      operationId: changeSystemOrganizationBranchStatus
      description: Supports reversible active/suspended transitions only. Suspension requires branch.deactivate and fresh MFA step-up; reactivation requires branch.update without step-up. A reason is optional for either transition.
      parameters:
        - $ref: '#/components/parameters/IfMatchVersion'
        - $ref: '#/components/parameters/SystemIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemResourceStatusChange'
      responses:
        '200':
          description: Updated actual owner-service status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemBranchSuccess'
        '400':
          description: Invalid request.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
