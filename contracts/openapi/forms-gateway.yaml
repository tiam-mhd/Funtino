openapi: 3.1.0
info:
  title: Funtino Forms Gateway API
  version: 1.0.0
  description: >-
    Public customer, operations and system forms endpoints. Customer routes allow a guest
    session; staff routes require a server-validated session and scoped IAM authorization.
servers:
  - url: http://localhost:4000
security:
  - sessionCookie: []
paths:
  /api/v1/customer/forms/session:
    get:
      operationId: getCustomerFormSession
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/customer/forms:
    get:
      operationId: listPublicForms
      security: []
      parameters:
        - $ref: '#/components/parameters/OptionalBranchId'
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/customer/forms/{slug}:
    get:
      operationId: getPublicForm
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/customer/forms/{slug}/responses:
    post:
      operationId: submitPublicFormResponse
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicResponseSubmission' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/operations/forms:
    get:
      operationId: listOperationsForms
      x-funtino-permission: forms.read
      parameters:
        - $ref: '#/components/parameters/ScopeType'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/OptionalBranchId'
        - $ref: '#/components/parameters/FormStatus'
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createOperationsForm
      x-funtino-permission: forms.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateForm' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/operations/forms/capabilities:
    get:
      operationId: getOperationsFormCapabilities
      description: Returns server-evaluated capabilities, including forms.responses.correct and forms.responses.pii.read. Sensitive fields require the PII permission and are audited; ordinary reads do not require MFA step-up. correctionStepUpRequired and exportStepUpRequired are true only when the corresponding permission is otherwise granted and fresh MFA is the remaining requirement.
      parameters:
        - $ref: '#/components/parameters/ScopeType'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/OptionalBranchId'
      responses:
        '200':
          description: Server-evaluated operations form capabilities.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OperationsFormCapabilities' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/operations/forms/responses/stats:
    get:
      operationId: getOperationsFormAggregateResponseStats
      x-funtino-permission: forms.responses.read
      description: Aggregate totals only; the response contains no answer or customer PII.
      parameters:
        - $ref: '#/components/parameters/ScopeType'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/OptionalBranchId'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/operations/forms/templates:
    get:
      operationId: listOperationsFormTemplates
      x-funtino-permission: forms.read
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/OptionalBranchId'
        - in: query
          name: scopeType
          schema: { type: string, enum: [organization, branch] }
        - in: query
          name: enabledOnly
          schema: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      operationId: createOperationsFormTemplate
      x-funtino-permission: forms.templates.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationsTemplateCreate' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/operations/forms/templates/{templateId}:
    patch:
      operationId: updateOperationsFormTemplate
      x-funtino-permission: forms.templates.manage
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationsTemplateUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/operations/forms/{formId}:
    get:
      operationId: getOperationsForm
      x-funtino-permission: forms.read
      parameters:
        - $ref: '#/components/parameters/FormId'
        - $ref: '#/components/parameters/ScopeType'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/OptionalBranchId'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/operations/forms/{formId}/duplicate:
    post:
      operationId: duplicateOperationsForm
      x-funtino-permission: forms.manage
      parameters:
        - $ref: '#/components/parameters/FormId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantScope' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/operations/forms/{formId}/draft:
    put:
      operationId: saveOperationsFormDraft
      x-funtino-permission: forms.manage
      parameters:
        - $ref: '#/components/parameters/FormId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/TenantScope' }
                - type: object
                  required: [definition]
                  properties:
                    definition: { $ref: '#/components/schemas/FormDefinition' }
              unevaluatedProperties: false
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/operations/forms/{formId}/settings:
    put:
      operationId: updateOperationsFormSettings
      x-funtino-permission: forms.manage
      parameters:
        - $ref: '#/components/parameters/FormId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormSettings' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/operations/forms/{formId}/publish:
    post:
      operationId: publishOperationsForm
      x-funtino-permission: forms.publish
      parameters:
        - $ref: '#/components/parameters/FormId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptionalReasonRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/operations/forms/{formId}/pause:
    post:
      operationId: pauseOperationsForm
      x-funtino-permission: forms.publish
      parameters:
        - $ref: '#/components/parameters/FormId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptionalReasonRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/operations/forms/{formId}/archive:
    post:
      operationId: archiveOperationsForm
      x-funtino-permission: forms.publish
      parameters:
        - $ref: '#/components/parameters/FormId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/operations/forms/{formId}/responses:
    get:
      operationId: listOperationsFormResponses
      x-funtino-permission: forms.responses.read
      parameters:
        - $ref: '#/components/parameters/FormId'
        - $ref: '#/components/parameters/ScopeType'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/OptionalBranchId'
        - $ref: '#/components/parameters/ResponseStatus'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: searchFieldId
          schema: { type: string, format: uuid }
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/operations/forms/{formId}/responses/stats:
    get:
      operationId: getOperationsFormResponseStats
      x-funtino-permission: forms.responses.read
      parameters:
        - $ref: '#/components/parameters/FormId'
        - $ref: '#/components/parameters/ScopeType'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/OptionalBranchId'
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/operations/forms/{formId}/responses/export:
    get:
      operationId: exportOperationsFormResponses
      x-funtino-permission: forms.responses.export
      parameters:
        - $ref: '#/components/parameters/FormId'
        - $ref: '#/components/parameters/ScopeType'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/OptionalBranchId'
        - $ref: '#/components/parameters/ResponseStatus'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - in: query
          name: includeSensitive
          schema: { type: boolean, default: false }
          description: Requires forms.responses.pii.read. The export itself requires forms.responses.export and its MFA step-up.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/operations/forms/{formId}/responses/{responseId}:
    get:
      operationId: getOperationsFormResponse
      x-funtino-permission: forms.responses.read
      parameters:
        - $ref: '#/components/parameters/FormId'
        - $ref: '#/components/parameters/ResponseId'
        - $ref: '#/components/parameters/ScopeType'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/OptionalBranchId'
        - in: query
          name: includeSensitive
          schema: { type: boolean, default: false }
          description: Requires forms.responses.pii.read; reading sensitive fields does not require MFA step-up.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/operations/forms/{formId}/responses/{responseId}/status:
    patch:
      operationId: updateOperationsFormResponseStatus
      x-funtino-permission: forms.responses.manage
      parameters:
        - $ref: '#/components/parameters/FormId'
        - $ref: '#/components/parameters/ResponseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/TenantScope' }
                - type: object
                  required: [status]
                  properties:
                    status: { $ref: '#/components/schemas/ResponseStatus' }
                    reason: { type: string, maxLength: 500 }
              unevaluatedProperties: false
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/operations/forms/{formId}/responses/{responseId}/answers:
    patch:
      operationId: correctOperationsFormResponseAnswers
      x-funtino-permission: forms.responses.correct
      description: Requires forms.responses.correct, forms.responses.read, and a fresh MFA step-up. Changes to sensitive fields also require forms.responses.pii.read; that permission alone never requires MFA. Each changed field is appended to the response correction history; submitted answer content is never emitted in the event.
      parameters:
        - $ref: '#/components/parameters/FormId'
        - $ref: '#/components/parameters/ResponseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/TenantScope' }
                - type: object
                  required: [expectedVersion, changes, reason]
                  properties:
                    expectedVersion: { type: integer, minimum: 0 }
                    changes:
                      type: array
                      minItems: 1
                      maxItems: 100
                      items:
                        type: object
                        required: [fieldId, value]
                        properties:
                          fieldId: { type: string, format: uuid }
                          value: {}
                        additionalProperties: false
                    reason: { type: string, minLength: 8, maxLength: 500 }
              unevaluatedProperties: false
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/operations/forms/{formId}/responses/{responseId}/notes:
    post:
      operationId: addOperationsFormResponseNote
      x-funtino-permission: forms.responses.manage
      parameters:
        - $ref: '#/components/parameters/FormId'
        - $ref: '#/components/parameters/ResponseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/TenantScope' }
                - type: object
                  required: [body]
                  properties:
                    body: { type: string, minLength: 1, maxLength: 2000 }
              unevaluatedProperties: false
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/operations/forms/{formId}/responses/{responseId}/tags:
    put:
      operationId: updateOperationsFormResponseTags
      x-funtino-permission: forms.responses.manage
      parameters:
        - $ref: '#/components/parameters/FormId'
        - $ref: '#/components/parameters/ResponseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/TenantScope' }
                - type: object
                  required: [tags]
                  properties:
                    tags:
                      {
                        type: array,
                        maxItems: 12,
                        items: { type: string, minLength: 1, maxLength: 40 },
                      }
              unevaluatedProperties: false
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/system/forms:
    get:
      operationId: listSystemForms
      x-funtino-permission: forms.platform.read
      parameters:
        - $ref: '#/components/parameters/OptionalOrganizationId'
        - $ref: '#/components/parameters/OptionalBranchId'
        - $ref: '#/components/parameters/FormStatus'
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/system/forms/templates:
    get:
      operationId: listSystemFormTemplates
      x-funtino-permission: forms.platform.read
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createSystemFormTemplate
      x-funtino-permission: forms.platform.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemTemplateCreate' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/system/forms/templates/{templateId}:
    patch:
      operationId: updateSystemFormTemplate
      x-funtino-permission: forms.platform.manage
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemTemplateUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/system/forms/settings:
    get:
      operationId: getSystemFormSettings
      x-funtino-permission: forms.platform.read
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      operationId: updateSystemFormSettings
      x-funtino-permission: forms.platform.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [defaultTheme]
              properties:
                defaultTheme: { $ref: '#/components/schemas/FormTheme' }
              additionalProperties: false
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: funtino_session
  parameters:
    Slug:
      in: path
      name: slug
      required: true
      schema:
        { type: string, minLength: 1, maxLength: 80, pattern: '^[\p{L}\p{N}]+(?:-[\p{L}\p{N}]+)*$' }
    FormId:
      in: path
      name: formId
      required: true
      schema: { type: string, format: uuid }
    ResponseId:
      in: path
      name: responseId
      required: true
      schema: { type: string, format: uuid }
    TemplateId:
      in: path
      name: templateId
      required: true
      schema: { type: string, format: uuid }
    ScopeType:
      in: query
      name: scopeType
      required: true
      schema: { type: string, enum: [organization, branch] }
    OrganizationId:
      in: query
      name: organizationId
      required: true
      schema: { type: string, format: uuid }
    OptionalOrganizationId:
      in: query
      name: organizationId
      required: false
      schema: { type: string, format: uuid }
    OptionalBranchId:
      in: query
      name: branchId
      required: false
      schema: { type: string, format: uuid }
    FormStatus:
      in: query
      name: status
      schema: { type: string, enum: [draft, published, paused, archived] }
    ResponseStatus:
      in: query
      name: status
      schema: { $ref: '#/components/schemas/ResponseStatus' }
    Query:
      in: query
      name: query
      schema: { type: string, maxLength: 120 }
    Cursor:
      in: query
      name: cursor
      schema: { type: string, format: uuid }
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    From:
      in: query
      name: from
      schema: { type: string, format: date-time }
    To:
      in: query
      name: to
      schema: { type: string, format: date-time }
  responses:
    Success:
      description: Successful API response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    Error:
      description: Request failed with a domain error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    OperationsFormCapabilities:
      type: object
      required:
        [
          canRead,
          canManage,
          canPublish,
          canReadResponses,
          canManageResponses,
          canCorrectResponses,
          correctionStepUpRequired,
          canReadSensitiveResponses,
          canExportResponses,
          exportStepUpRequired,
          canManageTemplates,
        ]
      properties:
        canRead: { type: boolean }
        canManage: { type: boolean }
        canPublish: { type: boolean }
        canReadResponses: { type: boolean }
        canManageResponses: { type: boolean }
        canCorrectResponses: { type: boolean }
        correctionStepUpRequired: { type: boolean }
        canReadSensitiveResponses: { type: boolean }
        canExportResponses: { type: boolean }
        exportStepUpRequired: { type: boolean }
        canManageTemplates: { type: boolean }
      additionalProperties: false
    SuccessEnvelope:
      type: object
      required: [status, data, meta]
      properties:
        status: { const: success }
        data: {}
        meta:
          type: object
          required: [requestId, correlationId]
          properties:
            requestId: { type: [string, 'null'] }
            correlationId: { type: [string, 'null'], format: uuid }
          additionalProperties: false
      additionalProperties: false
    ErrorEnvelope:
      type: object
      properties:
        status: { const: error }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
      additionalProperties: true
    TenantScope:
      type: object
      required: [organizationId]
      properties:
        organizationId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
    CreateForm:
      type: object
      required: [organizationId, branchId, title]
      properties:
        organizationId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 160 }
      additionalProperties: false
    FormSettings:
      allOf:
        - { $ref: '#/components/schemas/TenantScope' }
        - type: object
          required: [accessMode, linkEnabled]
          properties:
            accessMode: { type: string, enum: [guest, optional_auth, auth_required] }
            linkEnabled: { type: boolean }
            startsAt: { type: [string, 'null'], format: date-time }
            endsAt: { type: [string, 'null'], format: date-time }
            responseLimit: { type: [integer, 'null'], minimum: 1 }
      unevaluatedProperties: false
    ReasonRequest:
      allOf:
        - { $ref: '#/components/schemas/TenantScope' }
        - type: object
          required: [reason]
          properties:
            reason: { type: string, minLength: 8, maxLength: 500 }
      unevaluatedProperties: false
    OptionalReasonRequest:
      allOf:
        - { $ref: '#/components/schemas/TenantScope' }
        - type: object
          properties:
            reason: { type: string, maxLength: 500 }
      unevaluatedProperties: false
    PublicResponseSubmission:
      type: object
      required: [answers, idempotencyKey]
      properties:
        answers: { type: object, additionalProperties: true }
        idempotencyKey: { type: string, minLength: 16, maxLength: 80 }
        linkToAccountConsent: { type: boolean, default: false }
        linkParameters:
          type: object
          properties:
            source: { type: string, maxLength: 160 }
            campaign: { type: string, maxLength: 160 }
            ref: { type: string, maxLength: 160 }
          additionalProperties: false
      additionalProperties: false
    ResponseStatus:
      type: string
      enum: [new, in_review, followed_up, closed, spam]
    FormDefinition:
      oneOf:
        - { $ref: '../schemas/forms/form-definition.v1.schema.json' }
