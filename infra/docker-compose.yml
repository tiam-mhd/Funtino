name: funtino-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: funtino
      POSTGRES_USER: funtino
      POSTGRES_PASSWORD: funtino
    ports:
      - '5432:5432'
    volumes:
      - funtino-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U funtino -d funtino']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: funtino
      RABBITMQ_DEFAULT_PASS: funtino
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - funtino-rabbitmq:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - funtino-redis:/data

volumes:
  funtino-postgres:
  funtino-rabbitmq:
  funtino-redis:
